  // -----------------------------------------------------------------------------------------------------------------
  // The detail drawer (a story or an alert, SPEC 3.7)
  // -----------------------------------------------------------------------------------------------------------------

  /** Opens the drawer on one alert or story and asks the bot for it (`push`: from inside the drawer, so Back returns). Never throws. */
  function openDetail(kind, id, push, opener) {
    const prev = S.drawer;
    const stack = prev && push ? prev.stack.concat([{ kind: prev.kind, id: prev.id }]) : [];
    S.drawer = { kind, id, stack, resp: null, err: null, loading: true, opener: prev ? prev.opener : (opener || document.activeElement) };
    renderDrawer(true);
    const mine = S.drawer;
    call('dashDetail', kind, id).then(r => {
      if (S.drawer !== mine) return;
      mine.loading = false;
      mine.resp = r;
      renderDrawer(false);
    }, e => {
      if (S.drawer !== mine) return;
      mine.loading = false;
      mine.err = e;
      renderDrawer(false);
    });
  }

  /** Closes the drawer and gives focus back to what opened it. Never throws. */
  function closeDrawer() {
    const d = S.drawer;
    S.drawer = null;
    const root = $('#overlay-root');
    const drawer = $('#drawer');
    const scrim = $('#drawer-scrim');
    if (drawer) drawer.classList.remove('on');
    if (scrim) scrim.classList.remove('on');
    document.removeEventListener('keydown', drawerKeys, true);
    setTimeout(() => {
      if (S.drawer) return;
      if (drawer && drawer.parentNode === root) drawer.remove();
      if (scrim && scrim.parentNode === root) scrim.remove();
    }, reduceMotion.matches ? 0 : 320);
    const back = d && d.opener;
    if (back && document.body.contains(back) && back.focus) back.focus();
  }

  /** Escape closes the drawer; Tab stays inside it. Never throws. */
  function drawerKeys(ev) {
    const drawer = $('#drawer');
    if (!drawer || !S.drawer) return;
    if (ev.key === 'Escape') { ev.preventDefault(); closeDrawer(); return; }
    if (ev.key === 'Tab') trapTab(ev, drawer);
  }

  /** Keeps Tab focus inside `box`. Never throws. */
  function trapTab(ev, box) {
    const f = Array.prototype.filter.call(box.querySelectorAll('a[href], button:not([disabled]), input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])'),
      el => el.offsetParent !== null || el === document.activeElement);
    if (!f.length) return;
    const first = f[0];
    const last = f[f.length - 1];
    if (ev.shiftKey && (document.activeElement === first || !box.contains(document.activeElement))) { ev.preventDefault(); last.focus(); }
    else if (!ev.shiftKey && (document.activeElement === last || !box.contains(document.activeElement))) { ev.preventDefault(); first.focus(); }
  }

  /** Draws the drawer (glass; full screen on a phone): the recommended action first, then every part of the answer. Never throws. */
  function renderDrawer(opening) {
    const d = S.drawer;
    if (!d) return;
    const root = $('#overlay-root');
    let scrim = $('#drawer-scrim');
    let drawer = $('#drawer');
    if (!drawer) {
      scrim = h('div', { class: 'scrim', id: 'drawer-scrim', on: { click: closeDrawer } });
      drawer = h('aside', { class: 'drawer', id: 'drawer', role: 'dialog', 'aria-modal': 'true', 'aria-labelledby': 'drawer-title' });
      add(root, scrim, drawer);
      const sc = scrim;
      const dr = drawer;
      requestAnimationFrame(() => { if (S.drawer) { sc.classList.add('on'); dr.classList.add('on'); } });
    } else {
      scrim.classList.add('on');
      drawer.classList.add('on');
    }
    document.addEventListener('keydown', drawerKeys, true);
    const r = obj(d.resp);
    const head = h('div', { class: 'drawer-head' });
    const titleText = d.loading ? (d.kind === 'cluster' ? 'Opening the story' : 'Opening the alert') : r.ok === true ? (txt(r.title) || txt(r.id) || 'Not named')
      : (d.kind === 'cluster' ? 'The story could not be opened' : 'The alert could not be opened');
    const pills = h('div', { class: 'pills' });
    if (r.ok === true) {
      add(pills, h('span', { class: 'pill st-plain' }, r.kind === 'cluster' ? 'Story' : (KIND_WORDS[r.alertKind] || 'Alert')), levelPill(r.level));
      if (r.kind === 'cluster') add(pills, clusterStatusPill(obj(r.status).key));
      else add(pills, statusPill(r.status));
    }
    add(head, h('div', { style: { 'min-width': '0', flex: '1 1 auto' } }, h('h2', { id: 'drawer-title' }, titleText), pills));
    const btns = h('div', { class: 'btns' });
    if (d.stack.length) {
      add(btns, h('button', { type: 'button', class: 'btn btn--icon', 'aria-label': 'Back to the previous item',
        on: { click: () => { const p = d.stack[d.stack.length - 1]; const keepStack = d.stack.slice(0, -1); openDetail(p.kind, p.id, false); S.drawer.stack = keepStack; S.drawer.opener = d.opener; renderDrawer(false); } } }, icon('back')));
    }
    add(btns, h('button', { type: 'button', class: 'btn btn--icon', id: 'drawer-close', 'aria-label': 'Close the panel', on: { click: closeDrawer } }, icon('close')));
    add(head, btns);
    const body = h('div', { class: 'drawer-body' });
    if (d.loading) {
      add(body, h('p', { class: 'loading-word' }, h('span', { class: 'spinner', 'aria-hidden': 'true' }), 'Reading what the bot keeps about it...'),
        h('div', { class: 'skel skel-card', style: { height: '90px', 'margin-top': '16px' }, 'aria-hidden': 'true' }),
        h('div', { class: 'skel skel-line', style: { width: '80%' }, 'aria-hidden': 'true' }), h('div', { class: 'skel skel-line', style: { width: '60%' }, 'aria-hidden': 'true' }));
    } else if (d.err || r.ok !== true) {
      const retry = () => openDetail(d.kind, d.id, false, d.opener);
      add(body, d.err ? failBlock(d.err, retry, 'this item') : refusalBlock(r, retry, 'this item'));
    } else {
      try { add(body, detailBody(r)); } catch (e) { add(body, failBlock(new Error(`its answer could not be shown: ${errWords(e)}`), () => openDetail(d.kind, d.id, false, d.opener), 'this item')); }
    }
    drawer.replaceChildren(head, body);
    drawer.setAttribute('aria-busy', String(!!d.loading));
    if (opening || !drawer.contains(document.activeElement)) {
      const c = $('#drawer-close');
      if (c) c.focus({ preventScroll: true });
    }
  }

  /** A titled section of the drawer. Pure but for the DOM. */
  function dSection(title, kids) {
    return h('section', { class: 'd-section' }, h('h3', {}, title), kids);
  }

  /** The drawer's body for a dashDetail answer (SPEC 3.7). Pure but for the DOM. */
  function detailBody(r) {
    const out = h('div');
    const owner = obj(r.owner);
    const action = obj(r.action);
    add(out, dSection('What to do', h('div', { class: 'todo edge glow-soft' },
      h('p', { class: 'todo-label' }, 'Recommended next step'),
      h('p', { class: 'todo-text' }, txt(action.text) || 'The bot keeps no next step for this.'),
      owner.who ? h('p', { class: 'small muted', style: { 'margin-top': '8px' } },
        `Who has it: ${txt(owner.who)}${txt(owner.why) ? ` (${txt(owner.why)})` : ''}.${owner.derived ? ' Worked out from its state: the bot keeps no owner per alert.' : ''}`) : null)));
    const why = [txt(r.levelWhy) ? h('p', {}, h('b', {}, `${LEVEL_WORDS[levelOf(r.level)]}: `), txt(r.levelWhy)) : null,
      txt(r.explain) ? h('p', { class: 'muted', style: { 'margin-top': '6px' } }, txt(r.explain)) : null];
    if (why.some(Boolean)) add(out, dSection('Why', why));

    if (r.kind === 'cluster' && r.cluster) add(out, clusterFacts(obj(r.cluster)));

    const posts = arr(r.posts).map(obj);
    add(out, dSection(`Posts, in time order (${posts.length})`, posts.length
      ? h('ol', { class: 'feed' }, posts.map(p => h('li', { class: 'feed-item' },
        h('div', { class: 'feed-head' }, p.at ? timeEl(p.at) : h('span', {}, 'time not kept'), txt(p.author) ? h('span', {}, `· ${txt(p.author)}`) : null,
          txt(p.platform) ? h('span', {}, `· ${txt(p.platform)}`) : null, numOr(p.engagement) !== null ? h('span', {}, `· engagement ${fmt(p.engagement)}`) : null),
        txt(p.text) ? h('p', { class: 'feed-text' }, txt(p.text)) : null,
        h('div', { class: 'feed-links' }, p.url ? extLink(p.url, 'Open the post') : h('span', { class: 'muted' }, 'No link kept'),
          txt(p.source) ? h('span', { class: 'muted' }, txt(p.source)) : null))))
      : h('p', { class: 'muted' }, 'No posts are kept for it.')));

    const chat = arr(r.chat).map(obj);
    add(out, dSection(`Chat messages (${chat.length})`, chat.length
      ? h('ol', { class: 'feed' }, chat.map(m => h('li', { class: 'feed-item' },
        h('div', { class: 'feed-head' }, m.at ? timeEl(m.at) : h('span', {}, 'time not kept'), txt(m.who) ? h('span', {}, `· ${txt(m.who)}`) : null,
          txt(m.kind) ? h('span', { class: 'pill st-plain' }, txt(m.kind)) : null),
        txt(m.text) ? h('p', { class: 'feed-text' }, txt(m.text)) : null,
        m.link ? h('div', { class: 'feed-links' }, extLink(m.link, 'Open in Chat')) : null)))
      : h('p', { class: 'muted' }, 'No Chat messages are kept for it.')));

    if (r.alert) add(out, alertFacts(obj(r.alert)));

    const tl = arr(r.timeline).map(obj);
    add(out, dSection('Timeline', tl.length
      ? h('ol', { class: 'timeline' }, tl.map(t => h('li', {}, h('div', { class: 'small muted' }, clock(t.at) || 'time not kept'), h('div', {}, txt(t.what)))))
      : h('p', { class: 'muted' }, 'No times are kept for it.')));

    const rel = arr(r.related).map(obj);
    if (rel.length) {
      add(out, dSection('Related', h('ul', { class: 'plain-list' }, rel.map(x => h('li', {},
        (x.kind === 'alert' || x.kind === 'cluster') && x.id ? h('button', { type: 'button', class: 'row-open', on: { click: () => openDetail(x.kind, String(x.id), true) } },
          txt(x.title) || String(x.id)) : h('b', {}, txt(x.title) || txt(x.id)),
        txt(x.why) ? h('span', { class: 'sub' }, txt(x.why)) : null)))));
    }
    const cs = arr(r.cannotSee).map(obj);
    if (cs.length) {
      add(out, dSection('What the bot can\'t see', h('ul', { class: 'plain-list' }, cs.map(c => h('li', {},
        h('b', {}, `${txt(c.what)}: `), txt(c.why), txt(c.fix) ? h('span', { class: 'sub' }, `What to do: ${txt(c.fix)}`) : null)))));
    }
    return out;
  }

  /** A story's facts in the drawer: size, speed by hour (24 bars; hatched where an hour was not read), risk words, status. Pure but for the DOM. */
  function clusterFacts(c) {
    const ph = arr(c.perHour);
    const known = ph.filter(v => numOr(v) !== null);
    const max = Math.max(1, ...known.map(Number));
    const spark = h('div', { class: 'spark', role: 'img', 'aria-label': `Accounts per hour, the last 24 hours, oldest first: ${ph.map(v => (numOr(v) === null ? 'not read' : String(v))).join(', ')}` },
      ph.map(v => (numOr(v) === null ? h('span', { class: 'none', title: 'Not read' }) : h('span', { style: { height: `${Math.max(4, Math.round((Number(v) / max) * 100))}%` }, title: `${v}` }))));
    const rows = [['Accounts', fmt(c.accounts)], ['Posts', `${fmt(c.posts)}${numOr(c.postsKept) !== null && numOr(c.postsKept) !== numOr(c.posts) ? ` (${fmt(c.postsKept)} kept here)` : ''}`],
      ['Engagement', fmt(c.engagement)], ['Platforms', arr(c.platforms).join(', ') || 'none named'], ['Topic', txt(c.topic) || 'none named'],
      ['Speed', `${SPEED_WORDS[c.speed] || txt(c.speed)}${txt(c.speedWhy) ? `: ${txt(c.speedWhy)}` : ''}`],
      ['First post', clock(c.firstAt) || 'not kept'], ['Last post', clock(c.lastAt) || 'not kept']];
    if (arr(c.risk).length) rows.push(['Risk words', arr(c.risk).join(', ')]);
    if (txt(c.heldWhy)) rows.push(['Held back', txt(c.heldWhy)]);
    const card = obj(c.carded);
    const kids = [h('dl', { class: 'kv' }, rows.map(([k, v]) => [h('dt', {}, k), h('dd', {}, v)]))];
    if (ph.length) kids.push(h('p', { class: 'small muted', style: { 'margin-top': '12px' } }, 'Accounts per hour, the last 24 hours (hatched: not read)'), spark);
    if (card.alertId) {
      kids.push(h('p', { style: { 'margin-top': '12px' } }, `Its card: ${txt(card.alertId)}${txt(card.decision) ? ` (${txt(card.decision)})` : ''}. `,
        h('button', { type: 'button', class: 'btn btn--sm btn--tonal', on: { click: () => openDetail('alert', String(card.alertId), true) } }, 'Open its card'),
        card.link ? [' ', extLink(card.link, 'Open in Chat')] : null));
    }
    return dSection('The story', kids);
  }

  /** An alert's facts in the drawer: decision, corrections, fixes asked, the Social Alert email, T&S, escalation, follow-up, its fields. Pure but for the DOM. */
  function alertFacts(a) {
    const kids = [];
    kids.push(h('p', {}, h('b', {}, 'Decision: '), txt(a.decision) || 'none recorded'));
    if (a.ongoing === true) kids.push(h('p', { class: 'small' }, h('span', { class: 'pill st-warn' }, 'Ongoing issue')));
    const corr = arr(a.corrections).map(obj);
    if (corr.length) {
      kids.push(h('h4', { class: 'overline', style: { 'margin-top': '14px' } }, `Corrections the bot made (${corr.length})`),
        h('table', { class: 'corr' }, h('thead', {}, h('tr', {}, h('th', {}, 'Field'), h('th', {}, 'Was'), h('th', {}, 'Now'), h('th', {}, 'Why'))),
          h('tbody', {}, corr.map(c => h('tr', {}, h('td', {}, txt(c.field)), h('td', { class: 'old', 'data-label': 'Was' }, txt(c.old) || 'blank'),
            h('td', { 'data-label': 'Now' }, txt(c.new) || 'blank'), h('td', { 'data-label': 'Why' }, txt(c.reason)))))));

  /** Opens the small form that looks a post up by its link in everything the bot keeps (read-only). Never throws. */

    closeDialog(true);

  /** Escape closes the dialog; Tab stays inside it. Never throws. */
  function dialogKeys(ev) {
    const dlg = $('#dialog');
    if (!dlg) return;
    if (ev.key === 'Escape') { ev.preventDefault(); ev.stopImmediatePropagation(); closeDialog(); return; }

  /** Asks the bot about the typed link. Never throws. */
  function askWhyNot() {
    const d = S.dialog;
    if (!d || d.busy) return;
    const url = txt(d.url);
    if (!/^https?:\/\//i.test(url)) {
      d.resp = { ok: false, why: 'Paste the post\'s full link, starting with https://.' };
      d.err = null;
      renderWhyNot();
      const i = $('#whynot-url');
      if (i) i.focus();
      return;
    }
    d.busy = true;
    d.resp = null;
    d.err = null;
    renderWhyNot();
    call('dashWhyNot', url).then(r => {
      if (S.dialog !== d) return;
      d.busy = false;
      d.resp = r;
      renderWhyNot();
    }, e => {
      if (S.dialog !== d) return;
      d.busy = false;
      d.err = e;
      renderWhyNot();
    });
  }

  // -----------------------------------------------------------------------------------------------------------------
  // Slide deliveries: the list
  // -----------------------------------------------------------------------------------------------------------------

  /** Asks the bot for the deliveries and draws the area. Never throws. */
  function loadDeliveries() {
    const dv = S.deliv;
    if (dv.loading) return;
    dv.loading = true;
    setRefreshBusy(true);
    renderSlides();
    call('dashDeliveries').then(r => {
      dv.loading = false;
      dv.loaded = true;
      dv.resp = r;
      dv.err = null;
      setRefreshBusy(false);
      renderSlides();
    }, e => {
      dv.loading = false;
      dv.loaded = true;
      dv.err = e;
      setRefreshBusy(false);
      renderSlides();
    });
  }

  /** The first boolean among `keys` of `o` (null when none is a boolean). Pure. */
  function boolOf(o, keys) {
    for (let i = 0; i < keys.length; i++) if (typeof o[keys[i]] === 'boolean') return o[keys[i]];
    return null;
  }

  /**
   * Whether Preview and Run now can work, from the deliveries answer (or the Live snapshot's switches): {on, scopeOk,
   * canRun, why}. A flag the answer does not give is null (unknown: the buttons stay on and the bot's answer says).
   * Pure.
   */
  function delivGate() {
    const r = obj(S.deliv.resp);
    // set up, run, pause: for the people who can edit the bot's sheet, as the bot's own answer says (never while it loads or fails)
    const mayChange = r.ok === true && r.mayChange === true;
    let on = boolOf(r, ['on', 'switchOn', 'enabled', 'slideDeliveries']);
    if (on === null && obj(r.switches) && typeof obj(r.switches).slideDeliveries === 'boolean') on = r.switches.slideDeliveries;
    if (on === null && S.snap && typeof obj(S.snap.switches).slideDeliveries === 'boolean') on = S.snap.switches.slideDeliveries;
    const scopeOk = boolOf(r, ['scopeOk', 'scope', 'canEditSlides', 'authorized']);
    let canRun = boolOf(r, ['canRun']);
    if (canRun === null) canRun = on !== false && scopeOk !== false && r.paused !== true && r.controlOk !== false;
    let why = '';
    if (!canRun) {
      why = r.controlOk === false ? txt(r.controlWhy) : on === false ? (txt(r.offWhy) || DELIV_OFF_WHY) : r.paused === true ? txt(r.pausedWhy)
        : scopeOk === false ? (txt(r.scopeWhy) || DELIV_SCOPE_WHY) : txt(r.runWhy || r.why);
    }
    return { on, scopeOk, canRun, why, mayChange };
  }

  /** A delivery as the page reads it, whatever the answer's spelling (camelCase or the tab's column names). Pure. */
  function normDelivery(raw) {
    const d = obj(raw);
    let st = d.settings;
    if (typeof st === 'string') { try { st = JSON.parse(st); } catch (e) { st = {}; } }
    st = obj(st);
    const deck = Object.assign({}, obj(st.deck), obj(d.deck));
    if (!deck.id && d.deck_id) deck.id = d.deck_id;
    if (!deck.url && d.deck_url) deck.url = d.deck_url;
    let last = d.lastRun || d.last_run || null;
    if (typeof last === 'string') { try { last = JSON.parse(last); } catch (e) { last = null; } }
    return {
      id: txt(d.id || st.id), name: txt(d.name || st.name), deck,
      settings: Object.assign({}, st, { deck, id: txt(d.id || st.id), name: txt(d.name || st.name) }),
      status: txt(d.status) || 'active', lastRun: last && typeof last === 'object' ? last : null,
      nextRun: numOr(d.nextRun !== undefined ? d.nextRun : d.next_run),
      note: txt(d.note || d.problem) || (arr(d.problems).map(txt).filter(Boolean).length ? `Its saved settings need a look: ${arr(d.problems).map(txt).filter(Boolean).join(' ')}` : ''),
      updatedAt: numOr(d.updatedAt !== undefined ? d.updatedAt : d.updated_at), updatedBy: txt(d.updatedBy || d.updated_by),
      waiting: d.waiting && typeof d.waiting === 'object' ? obj(d.waiting) : null,
    };
  }

  /** The deliveries of the answer. Pure. */
  function deliveries() {
    const r = obj(S.deliv.resp);
    return arr(r.deliveries || r.list || r.items).map(normDelivery);
  }

  /** "After slide 3 (Agenda), before slide 4 (Pulse)" for a delivery's spot. Pure. */
  function spotWords(spot) {
    const s = obj(spot);
    const a = txt(s.afterLabel);
    const b = txt(s.beforeLabel);
    if (a && b) return `After ${a}, before ${b}`;
    if (a) return `At the end, after ${a}`;
    if (b) return `At the start, before ${b}`;
    if (s.afterId || s.beforeId) return 'A spot picked by slide (its names are not kept)';
    return 'No spot picked yet';
  }

  /** "Weekdays at 09:00 (America/New_York)" for a schedule. Pure. */
  function scheduleWords(sched) {
    const s = obj(sched);
    const days = arr(s.days).map(Number).filter(d => d >= 0 && d <= 6);
    const set = new Set(days);
    let dw = '';
    if (!days.length) dw = 'No days picked';
    else if (set.size === 7) dw = 'Every day';
    else if (set.size === 5 && [1, 2, 3, 4, 5].every(d => set.has(d))) dw = 'Weekdays';
    else dw = DAY_ORDER.filter(d => set.has(d)).map(d => DAY_SHORT[d]).join(', ');
    const parts = [`${dw}${txt(s.time) ? ` at ${txt(s.time)}` : ''}${txt(s.tz) ? ` (${txt(s.tz)})` : ''}`];
    if (s.sincePrevious) parts.push('each slide covers the time since the run before');
    else if (s.mondayCoversWeekend) parts.push('Monday covers the weekend');
    return parts.join('; ');
  }

  /** "12 hours", "1 day", "1 day and 12 hours", "30 days". Pure. */
  function lookbackWords(hours) {
    const n = numOr(hours);
    if (n === null || n <= 0) return 'not set';
    if (n < 24) return `${n} ${n === 1 ? 'hour' : 'hours'}`;
    const d = Math.floor(n / 24);
    const r = n % 24;
    return `${d} ${d === 1 ? 'day' : 'days'}${r ? ` and ${r} ${r === 1 ? 'hour' : 'hours'}` : ''}`;
  }

  /** Draws the Slide deliveries area: the editor when one is open, else the list. Never throws. */
  function renderSlides() {
    const root = $('#slides-root');
    if (!root) return;
    const keep = rememberFocus();
    root.replaceChildren();
    try {
      if (S.editor) add(root, editorView());
      else add(root, deliveriesList());
    } catch (e) {
      add(root, failBlock(new Error(`the deliveries could not be shown: ${errWords(e)}`), () => loadDeliveries(), 'the deliveries'));
    }
    restoreFocus(keep);
  }

      ? h('span', {}, h('span', { class: 'pill st-warn' }, 'Waiting'), ' ', d.nextRun ? clock(d.nextRun, txt(sched.tz) || undefined) : '', h('span', { class: 'sub' }, waitWords))
      : d.nextRun ? clock(d.nextRun, txt(sched.tz) || undefined) : 'Not scheduled';
    const runReason = !gate.canRun ? gate.why : paused ? 'Resume it first to run it.' : '';
    const reasonId = `run-why-${cssId(d.id)}`;
    const busy = res && res.busy;
    const opts = [];
    opts.push(st.countOwn ? 'The bot\'s own finds count' : 'Burson\'s alerts only');

        h('div', {}, h('dt', {}, 'Last run'), h('dd', {}, lastEl)),
        h('div', {}, h('dt', {}, 'Next run'), h('dd', {}, next))),
      h('p', { class: 'small muted', style: { 'margin-top': '10px' } }, opts.join(' · ')),
      d.note ? h('p', { class: 'why-off', style: { 'margin-top': '6px' } }, d.note) : null);
    if (!gate.mayChange) return card;  // the delivery as it is, with no button that changes it
    const actions = h('div', { class: 'deliv-actions' },
      h('button', { type: 'button', class: 'btn btn--primary btn--sm', disabled: !!runReason || busy, 'aria-describedby': runReason ? reasonId : null,
        'data-fk': `run:${d.id}`, on: { click: () => runNow(d) } }, icon('play'), busy && res.what === 'run' ? 'Running...' : 'Run now'),
      h('button', { type: 'button', class: 'btn btn--sm', disabled: busy, 'data-fk': `pause:${d.id}`, on: { click: () => setStatus(d, paused ? 'active' : 'paused') } },
        icon(paused ? 'play' : 'pause'), paused ? 'Resume' : 'Pause'),
      h('button', { type: 'button', class: 'btn btn--sm btn--outlined', disabled: busy, 'data-fk': `edit:${d.id}`, on: { click: () => openEditor(d) } }, icon('edit'), 'Edit'),
      runReason ? h('span', { class: 'why-off', id: reasonId }, `Run now is off: ${runReason}`) : null);
    add(card, actions);
    if (res && !res.busy && res.text) {
      add(card, h('div', { class: `coverage${res.ok ? '' : ' warn'}`, role: 'status', style: { 'margin-top': '12px' } }, res.text, res.link ? [' ', extLink(res.link, 'Open the slide')] : null));
    }
    return card;
  }

  /**
   * Who a run told, in a sentence: the bot keeps "emailed 2", or why nobody was emailed ("not emailed: Testing, and
   * Control!B30 ... is blank"); '' when it keeps nothing. Pure.
   */
  function notifiedWords(v) {
    const t = txt(v);
    if (!t) return '';
    const m = t.match(/^emailed (\d+)$/i);
    if (m) return `Emailed ${pl(Number(m[1]), 'address', 'addresses')} on its notify list.`;
    if (/^sending$/i.test(t)) return 'The notice email was being sent when this was read.';
    return `${t.charAt(0).toUpperCase()}${t.slice(1)}${/[.!?]$/.test(t) ? '' : '.'}`;
  }

  /** Runs a delivery now (dashRunNow) and says what happened. Never throws. */
  function runNow(d) {
    S.deliv.results[d.id] = { busy: true, what: 'run' };
    renderSlides();
    call('dashRunNow', d.id).then(r => {
      const x = obj(r);
      const last = obj(x.lastRun || x.last_run);
      const link = safeUrl(x.link || last.link);
      const told = notifiedWords(x.notified || last.notified);
      S.deliv.results[d.id] = { busy: false, ok: x.ok === true, link,
        text: x.ok === true ? `${txt(x.note) || 'Delivered.'}${told ? ` ${told}` : ''}` : (txt(x.why) || 'The run did not deliver, and the bot did not say why.') };
      loadDeliveries();
    }, e => {
      S.deliv.results[d.id] = { busy: false, ok: false, text: `The bot could not be reached: ${errWords(e)}. Try again in a minute.` };
      renderSlides();
    });
  }

  /** Pauses or resumes a delivery (dashSetDeliveryStatus). Never throws. */
  function setStatus(d, status) {
    S.deliv.results[d.id] = { busy: true, what: 'status' };
    renderSlides();
    call('dashSetDeliveryStatus', d.id, status).then(r => {
      const x = obj(r);
      S.deliv.results[d.id] = { busy: false, ok: x.ok === true,
        text: x.ok === true ? (status === 'paused' ? 'Paused: it will not run until it is resumed.' : 'Resumed: it runs on its schedule again.') : (txt(x.why) || 'The bot did not change it, and did not say why.') };
      loadDeliveries();
    }, e => {
      S.deliv.results[d.id] = { busy: false, ok: false, text: `The bot could not be reached: ${errWords(e)}. Try again in a minute.` };
      renderSlides();
    });
  }

  // -----------------------------------------------------------------------------------------------------------------
  // Slide deliveries: the editor
  // -----------------------------------------------------------------------------------------------------------------

  /** A new delivery's settings: weekdays at 09:00 on this device's time zone, a day back, own stories and sensitive links OFF. Pure. */
  function newSettings() {
    return {
      name: '', deck: { id: '', url: '', title: '' }, spot: null, design: { mode: 'default', slideId: '' }, lookbackHours: 24,
      schedule: { days: [1, 2, 3, 4, 5], time: '09:00', tz: deviceTz() || 'UTC', mondayCoversWeekend: true },
      countOwn: false, linkSensitive: false, slides: { pulse: true, positive: false }, mode: 'replace', notify: [],
    };
  }

  /** Opens the editor on a delivery (null: a new one); an existing deck is checked at once to show its slides. Never throws. */
  function openEditor(d) {
    if (!delivGate().mayChange) return;  // only for the people who may set deliveries up
    const base = newSettings();
    let s = base;
    if (d) {
      const st = obj(d.settings);
      s = Object.assign({}, base, st, {
        id: d.id, name: d.name || txt(st.name), deck: Object.assign({}, base.deck, obj(st.deck), d.deck),
        design: Object.assign({}, base.design, obj(st.design)), schedule: Object.assign({}, base.schedule, obj(st.schedule)),
        slides: Object.assign({}, base.slides, obj(st.slides)), notify: arr(st.notify).map(txt).filter(Boolean),
        spot: st.spot ? obj(st.spot) : null,
      });
      if (numOr(s.lookbackHours) === null) s.lookbackHours = base.lookbackHours;
    }
    S.editor = { s, check: null, checking: false, checkErr: null, cover: null, covering: false, coverErr: null,
      preview: null, previewing: false, previewErr: null, saving: false, saveResp: null, saveErr: null, notifyText: s.notify.join('\n'),
      editing: !!d, spotLost: false };
    renderSlides();
    scrollToEl($('#slides-root'));
    const first = $('#ed-name');
    if (first) first.focus({ preventScroll: true });
    if (d && txt(s.deck.url)) checkDeck();
    scheduleCheckSoon(0);
  }

  /** Closes the editor without saving. Never throws. */
  function closeEditor() {
    S.editor = null;
    renderSlides();
    const b = $('[data-fk="deliv:new"]');
    if (b) b.focus();
  }

  /** The settings the bot is sent (SPEC 4.2), from the editor. Pure. */
  function settingsOut() {
    const e = S.editor;
    const s = e.s;
    const out = {
      name: txt(s.name), deck: { id: txt(s.deck.id), url: txt(s.deck.url), title: txt(s.deck.title) },
      spot: s.spot ? { afterId: txt(s.spot.afterId), beforeId: txt(s.spot.beforeId), afterLabel: txt(s.spot.afterLabel), beforeLabel: txt(s.spot.beforeLabel) } : null,

      lookbackHours: Math.round(numOr(s.lookbackHours) || 24),

  /** What is still missing before the delivery can be saved (plain words), [] when nothing is. Pure. */
  function missingForSave() {
    const e = S.editor;
    const s = e.s;
    const out = [];
    if (!txt(s.name)) out.push('a name');
    if (!txt(s.deck.id)) out.push('a checked deck (paste its link and press Check)');

  /** Step 1: the deck link and its check (edit access, the bot account to share with, its slides). Pure but for the DOM. */

    const e = S.editor;

  /** The checked deck's slides, in order. Pure. */
  function deckSlides() {
    const r = S.editor && S.editor.check ? obj(S.editor.check) : null;
    if (!r || r.ok !== true) return [];
    return arr(r.slides).map(obj).filter(x => txt(x.id)).sort((a, b) => (numOr(a.index) || 0) - (numOr(b.index) || 0));
  }

  /** "Slide 3: Agenda". Pure. */
  function slideLabel(sl, i) {
    return `slide ${i + 1}${txt(sl.title) ? ` (${txt(sl.title)})` : ''}`;
  }

  /** Step 2: the spot, picked by clicking a gap between two slides. Pure but for the DOM. */
  function stepSpot() {
    const e = S.editor;
    const s = e.s;
    const slides = deckSlides();
    if (!slides.length) {
      return step('Where the pulse slide goes', 'Check the deck first: its slides show here, and you pick the gap the pulse slide goes into.', false, true,
        [h('p', { class: 'muted' }, s.spot ? `Saved before: ${spotWords(s.spot)}.` : 'No deck checked yet.')], 'step-spot');
    }
    const list = h('ol', { class: 'slides-pick', 'aria-label': 'The deck\'s slides and the gaps between them' });
    const sp = obj(s.spot);
    const gapBtn = g => {
      const after = slides[g - 1] || null;
      const before = slides[g] || null;
      const picked = !!s.spot && txt(sp.afterId) === txt(after && after.id) && txt(sp.beforeId) === txt(before && before.id);
      const words = !after ? 'Put it at the start, before slide 1' : !before ? `Put it at the end, after slide ${g}` : `Put it between slide ${g} and slide ${g + 1}`;
      return h('li', {}, h('button', { type: 'button', class: 'gap-btn', 'aria-pressed': String(picked), 'data-fk': `gap:${g}`,
        on: { click: () => {
          s.spot = { afterId: after ? txt(after.id) : '', beforeId: before ? txt(before.id) : '', afterLabel: after ? slideLabel(after, g - 1) : '', beforeLabel: before ? slideLabel(before, g) : '' };
          e.spotLost = false;
          e.preview = null;
          renderSlides();
        } } }, picked ? 'The pulse slide goes here' : words));
    };
    slides.forEach((sl, i) => {
      add(list, gapBtn(i));
      add(list, h('li', { class: 'slide-item' }, h('span', { class: 'slide-num' }, String(i + 1)),
        h('div', {}, h('div', { class: 'slide-title' }, txt(sl.title) || 'Untitled slide'),
          txt(sl.text) ? h('div', { class: 'slide-text' }, txt(sl.text).slice(0, 160)) : null,
          txt(sl.layoutName) ? h('div', { class: 'slide-text' }, `Layout: ${txt(sl.layoutName)}`) : null)));
    });
    add(list, gapBtn(slides.length));
    return step('Where the pulse slide goes', 'Click the gap between two slides. If someone deletes the slide before it, the bot uses the slide after it; if both are gone, it delivers nothing and says so.',
      !!s.spot, false, [s.spot ? h('p', { class: 'small' }, h('b', {}, 'Picked: '), spotWords(s.spot)) : null, list], 'step-spot');
  }

      on: { change: () => { s.design.mode = value; e.preview = null; renderSlides(); } } }), h('span', {}, words));
    const kids = [radio('default', 'Follow the deck\'s own design: its title-and-body layout and theme'),
      radio('copy', 'Copy the look of one of its slides: its layout, background and text styles')];
    if (s.design.mode === 'copy') {
      kids.push(slides.length ? h('label', { class: 'field', style: { 'max-width': '520px' } }, h('span', {}, 'The slide whose look to copy'),
        h('select', { class: 'select', 'data-fk': 'design:slide', on: { change: ev => { s.design.slideId = ev.target.value; stalePreview(); refreshSaveBar(); } } },
          [h('option', { value: '' }, 'Pick a slide')].concat(slides.map((sl, i) => h('option', { value: txt(sl.id), selected: txt(sl.id) === txt(s.design.slideId),
            disabled: sl.titled === false && s.mode !== 'add' }, `${i + 1}. ${txt(sl.title) || 'Untitled slide'}${sl.titled === false && s.mode !== 'add'
              ? ' (its layout has no title box, so its look can\'t be copied)' : ''}`)))))
        : h('p', { class: 'muted' }, 'Check the deck first to pick a slide.'));
    }
    return step('Design', 'The slide follows the deck\'s design, never this page\'s.', s.design.mode === 'default' || !!txt(s.design.slideId), false, kids, 'step-design');
  }

  /** The slider's stops with `hours` among them (a saved lookback that is not a stop is kept as it is). Pure. */
  function lookbackStops(hours) {
    const n = numOr(hours);
    const stops = LOOKBACK_STOPS.slice();
    if (n !== null && n >= 1 && n <= 720 && stops.indexOf(n) < 0) { stops.push(n); stops.sort((a, b) => a - b); }
    return stops;
  }

  /** Step 4: how far back it looks (1 hour to 30 days, non-linear stops). Pure but for the DOM. */
  function stepLookback() {
    const e = S.editor;
    const s = e.s;
    const stops = lookbackStops(s.lookbackHours);
    const idx = Math.max(0, stops.indexOf(Math.round(numOr(s.lookbackHours) || 24)));
    const label = h('p', { class: 'range-label', id: 'lookback-label', 'aria-live': 'polite' }, `Looks back ${lookbackWords(stops[idx])}`);
    const range = h('input', { type: 'range', class: 'range', min: '0', max: String(stops.length - 1), step: '1', value: String(idx), 'data-fk': 'ed:lookback',
      'aria-label': 'How far back it looks', 'aria-valuetext': lookbackWords(stops[idx]),
      on: { input: ev => {
        const v = stops[Number(ev.target.value)] || 24;
        s.lookbackHours = v;
        stalePreview();
        label.textContent = `Looks back ${lookbackWords(v)}`;
        ev.target.setAttribute('aria-valuetext', lookbackWords(v));
        scheduleCheckSoon(400);
      } } });
    const since = s.schedule.sincePrevious ? h('p', { class: 'small', role: 'note' }, 'Each slide covers the time since the scheduled run before it (Match, in the schedule below): this lookback is used only for a slide with no run before it in the last 8 days.') : null;
    return step('How far back it looks', 'Each slide covers the alerts of this window before its run. From 1 hour to 30 days.', true, false,
      [label, range, since, h('div', { class: 'small muted', style: { display: 'flex', 'justify-content': 'space-between', 'max-width': '520px' } }, h('span', {}, '1 hour'), h('span', {}, '30 days'))], 'step-lookback');
  }

  /** The time zones to offer: this device's first, then the saved one, then every zone the browser knows. Pure. */
  function timeZones(current) {
    const dev = deviceTz();
    let all = [];
    try { all = typeof Intl.supportedValuesOf === 'function' ? Intl.supportedValuesOf('timeZone') : []; } catch (e) { all = []; }
    const out = [];
    [dev, current].concat(all, ['UTC']).forEach(z => { if (z && out.indexOf(z) < 0) out.push(z); });
    return out;
  }

  /** Step 5: the schedule (days, time, time zone, Monday covers the weekend) with the coverage check and Match. Pure but for the DOM. */
  function stepSchedule() {
    const e = S.editor;
    const s = e.s;
    const sc = s.schedule;
    const days = new Set(arr(sc.days).map(Number));
    const chips = h('div', { class: 'daychips', role: 'group', 'aria-label': 'Days' }, DAY_ORDER.map(d => h('button', { type: 'button', class: 'chip', 'aria-pressed': String(days.has(d)),
      'aria-label': DAY_LONG[d], 'data-fk': `day:${d}`, on: { click: () => {
        const set = new Set(arr(sc.days).map(Number));
        if (set.has(d)) set.delete(d); else set.add(d);
        sc.days = Array.from(set).sort((a, b) => a - b);
        e.preview = null;
        renderSlides();
        scheduleCheckSoon(300);
      } } }, DAY_SHORT[d])));
    const dev = deviceTz();
    const tz = h('label', { class: 'field' }, h('span', {}, 'Time zone'),
      h('select', { class: 'select', 'data-fk': 'ed:tz', on: { change: ev => { sc.tz = ev.target.value; stalePreview(); scheduleCheckSoon(200); refreshSaveBar(); } } },
        timeZones(sc.tz).map(z => h('option', { value: z, selected: z === sc.tz }, z === dev ? `${z} (this device)` : z))));
    const time = h('label', { class: 'field' }, h('span', {}, 'Time'),
      h('input', { class: 'input', type: 'time', value: txt(sc.time), 'data-fk': 'ed:time', on: { change: ev => { sc.time = ev.target.value; stalePreview(); scheduleCheckSoon(200); refreshSaveBar(); } } }));
    const sinceBox = h('label', { class: 'check' }, h('input', { type: 'checkbox', checked: !!sc.sincePrevious, 'data-fk': 'ed:since',
      on: { change: ev => { sc.sincePrevious = ev.target.checked; e.preview = null; renderSlides(); scheduleCheckSoon(200); } } }),
    h('span', {}, 'Each slide covers the time since the run before (for days with different gaps between them)'));
    const monday = h('label', { class: 'check' }, h('input', { type: 'checkbox', checked: !!sc.mondayCoversWeekend, 'data-fk': 'ed:monday',
      on: { change: ev => { sc.mondayCoversWeekend = ev.target.checked; stalePreview(); scheduleCheckSoon(200); } } }),
    h('span', {}, 'Monday covers the weekend (Monday\'s slide starts where Friday\'s ended)'));
    return step('When it is delivered', 'Pick the days and the time. The bot checks the schedule against how far back it looks: hours no slide covers, or slides that repeat each other.',
      days.size > 0 && !!txt(sc.time) && !!txt(sc.tz), false,
      [chips, h('div', { class: 'inline-fields' }, time, tz), monday, sinceBox, h('div', { id: 'coverage' }, coverageBox())], 'step-schedule');
  }

  /** The coverage message from dashScheduleCheck, with a Match button when the bot offers a match. Pure but for the DOM. */
  function coverageBox() {
    const e = S.editor;
    if (!e) return null;
    if (e.covering && !e.cover) return h('p', { class: 'loading-word small' }, h('span', { class: 'spinner', 'aria-hidden': 'true' }), 'Checking the schedule...');
    if (e.coverErr) return inlineProblem(null, e.coverErr);
    if (!e.cover) return null;
    const r = obj(e.cover);
    if (r.ok !== true) return inlineProblem(r);
    const lines = [];
    const words = x => (typeof x === 'string' ? txt(x) : txt(obj(x).text || obj(x).words || obj(x).why || obj(x).message));
    // dashScheduleCheck: {coverage: {ok, gaps, overlaps} (sentences), next: [{at, label}], match, matched}
    const cov = obj(r.coverage);
    const gaps = arr(r.gaps).concat(arr(cov.gaps));
    const overlaps = arr(r.overlaps).concat(arr(cov.overlaps));
    arr(r.messages).forEach(m => { const w = words(m); if (w) lines.push(w); });
    if (!lines.length && txt(r.message)) lines.push(txt(r.message));
    if (!lines.length) gaps.concat(overlaps).forEach(m => { const w = words(m); if (w) lines.push(w); });
    const problem = gaps.length > 0 || overlaps.length > 0 || r.covered === false || cov.ok === false;
    const told = (Array.isArray(r.gaps) && Array.isArray(r.overlaps)) || (Array.isArray(cov.gaps) && Array.isArray(cov.overlaps));
    if (!lines.length) {
      if (told && !problem) lines.push('Every hour is on exactly one slide: no hour is left out, and no slide repeats the one before.');
      else lines.push('The bot did not say whether this schedule covers every hour.');
    }
    const first = obj(arr(r.next)[0]);
    const next = numOr(r.nextRun !== undefined ? r.nextRun : first.at !== undefined ? first.at : arr(r.nextRuns)[0]);
    const nextLabel = txt(first.label);
    const m = r.match ? obj(r.match) : null;
    const s = e.s;
    // "Match": each slide covering the time since the run before (when the times between runs differ), else a lookback
    const since = !!(m && m.sincePrevious === true);
    // a schedule covering the time since the run before that leaves no gap and no overlap is kept: a lookback would bring
    // the gap or the overlap back at the next clock change past the 14 days checked
    const matchDiffers = m && !(s.schedule.sincePrevious && !problem) &&
      (since ? !s.schedule.sincePrevious : ((numOr(m.lookbackHours) !== null && numOr(m.lookbackHours) !== numOr(s.lookbackHours)) ||
      (typeof m.mondayCoversWeekend === 'boolean' && m.mondayCoversWeekend !== !!s.schedule.mondayCoversWeekend) || !!s.schedule.sincePrevious));
    const matchWords = !m ? '' : since ? 'cover the time since the run before on each slide' : [numOr(m.lookbackHours) !== null && numOr(m.lookbackHours) !== numOr(s.lookbackHours) ? `look back ${lookbackWords(m.lookbackHours)}` : '',
      typeof m.mondayCoversWeekend === 'boolean' && m.mondayCoversWeekend !== !!s.schedule.mondayCoversWeekend
        ? (m.mondayCoversWeekend ? 'let Monday cover the weekend' : 'stop Monday covering the weekend') : '',
      s.schedule.sincePrevious ? 'use the lookback again' : ''].filter(Boolean).join(' and ');
    return h('div', { class: `coverage${problem ? ' warn' : ''}`, role: 'status' },
      lines.length === 1 ? h('p', {}, lines[0]) : h('ul', {}, lines.map(l => h('li', {}, l))),
      next ? h('p', { class: 'small', style: { 'margin-top': '6px' } }, `First run: ${nextLabel || clock(next, txt(s.schedule.tz) || undefined)}`) : null,
      m && txt(m.text) && matchDiffers ? h('p', { class: 'small', style: { 'margin-top': '6px' } }, txt(m.text)) : null,
      matchDiffers && matchWords ? h('div', { style: { 'margin-top': '8px' } }, h('button', { type: 'button', class: 'btn btn--sm btn--tonal btn--wrap', 'data-fk': 'ed:match',
        on: { click: () => {
          if (numOr(m.lookbackHours) !== null) s.lookbackHours = Math.round(numOr(m.lookbackHours));
          if (typeof m.mondayCoversWeekend === 'boolean') s.schedule.mondayCoversWeekend = m.mondayCoversWeekend;
          s.schedule.sincePrevious = since;
          e.preview = null;
          renderSlides();
          scheduleCheckSoon(0);
        } } }, `Match: ${matchWords}`)) : null);
  }

  /** Asks the bot to check the schedule's coverage after a short pause (typing and sliding don't ask on every step). Never throws. */
  function scheduleCheckSoon(ms) {
    clearTimeout(scheduleCheckSoon.t);
    scheduleCheckSoon.t = setTimeout(checkSchedule, ms || 0);
  }

  /** Asks dashScheduleCheck about the editor's schedule and draws the answer in place. Never throws. */
  function checkSchedule() {
    const e = S.editor;
    if (!e) return;
    if (!arr(e.s.schedule.days).length || !txt(e.s.schedule.time)) { e.cover = null; redrawCoverage(); return; }
    e.covering = true;
    e.coverErr = null;
    const ask = ++checkSchedule.n;
    redrawCoverage();
    call('dashScheduleCheck', settingsOut()).then(r => {
      if (S.editor !== e || ask !== checkSchedule.n) return;
      e.covering = false;
      e.cover = r;
      redrawCoverage();
    }, err => {
      if (S.editor !== e || ask !== checkSchedule.n) return;
      e.covering = false;
      e.coverErr = err;
      redrawCoverage();
    });
  }
  checkSchedule.n = 0;

  /** Draws the coverage box again in place. Never throws. */
  function redrawCoverage() {
    const box = $('#coverage');
    if (!box) return;
    const keep = rememberFocus();
    box.replaceChildren(coverageBox() || '');
    restoreFocus(keep);
  }

  /** Step 6: the options (own stories count, link T&S / sensitive posts, which slides, replace or add, who is told). Pure but for the DOM. */

  /** A setting the slide depends on changed: an earlier preview no longer matches, so it is taken away. Never throws. */
  function stalePreview() {
    const e = S.editor;
    if (!e || !e.preview) return;
    e.preview = null;
    const el = $('#step-preview');
    if (el) el.replaceWith(stepPreview(delivGate()));
  }

  /** Step 7: the preview (dashPreview), drawn as slides with the deck's own design values. Pure but for the DOM. */
  function stepPreview(gate) {
    const e = S.editor;
    const missing = missingForSave().filter(m => m.indexOf('name') < 0);
    const off = !gate.canRun;
    const reason = off ? gate.why : missing.length ? `First pick ${missing.join(', ')}.` : '';
    const kids = [h('div', { class: 'inline-fields' },
      h('button', { type: 'button', class: 'btn btn--primary', disabled: !!reason || e.previewing, 'aria-describedby': reason ? 'preview-why' : null, 'data-fk': 'ed:preview',
        on: { click: previewNow } }, icon('eye'), e.previewing ? 'Building the preview...' : 'Preview'),
      reason ? h('span', { class: 'why-off', id: 'preview-why' }, `Preview is off: ${reason}`) : null)];
    if (e.previewing) kids.push(h('p', { class: 'loading-word' }, h('span', { class: 'spinner', 'aria-hidden': 'true' }), 'The bot is building the slide from the alerts of the window (this can take a minute)...'));
    else if (e.previewErr) kids.push(inlineProblem(null, e.previewErr));
    else if (e.preview && obj(e.preview).ok !== true) kids.push(inlineProblem(e.preview));
    else if (e.preview) kids.push(previewSlides(obj(e.preview)));
    return step('Preview', 'See the slide as it would be delivered now, built from the bot\'s real alerts. Nothing is written to the deck.', !!(e.preview && obj(e.preview).ok === true), false, kids, 'step-preview');
  }

  /** Asks the bot for a preview. Never throws. */
  function previewNow() {
    const e = S.editor;
    if (!e || e.previewing) return;
    e.previewing = true;
    e.preview = null;
    e.previewErr = null;
    renderSlides();
    call('dashPreview', settingsOut()).then(r => {
      if (S.editor !== e) return;
      e.previewing = false;
      e.preview = r;
      if (r && (r.off || r.scope === false || r.scopeOk === false) && S.deliv.resp) {
        if (r.off) S.deliv.resp.on = false;
        if (r.scope === false || r.scopeOk === false) S.deliv.resp.scopeOk = false;
        if (txt(r.why)) S.deliv.resp.runWhy = txt(r.why);
      }
      renderSlides();
      const p = $('#step-preview');
      if (p) scrollToEl(p);
    }, err => {
      if (S.editor !== e) return;
      e.previewing = false;
      e.previewErr = err;
      renderSlides();
    });
  }

  /** A CSS colour from the deck's design value, or '' when it is not a plain colour. Pure. */
  function cssColor(v) {
    const t = txt(v);
    return /^#[0-9a-f]{3,8}$/i.test(t) || /^rgba?\([\d\s.,%]+\)$/i.test(t) ? t : '';
  }

  /** The preview's slides, drawn 16:9 with the deck's design values (background, font, colours, sizes in points). Pure but for the DOM. */
  function previewSlides(r) {
    const des = obj(r.design);
    const bg = cssColor(des.bg || des.background);
    const font = txt(des.font || des.fontFamily).replace(/["';<>{}]/g, '');
    const tc = cssColor(des.titleColor);
    const bc = cssColor(des.bodyColor);
    const ts = numOr(des.titleSize);
    const bs = numOr(des.bodySize);
    const plain = !bg && !font && !tc && !bc && ts === null && bs === null;
    const wrap = h('div', { style: { display: 'grid', gap: '12px' } });
    const win = typeof r.window === 'string' ? txt(r.window) : txt(obj(r.window).label);
    if (win) add(wrap, h('p', { class: 'small' }, h('b', {}, 'Window: '), win));
    const slides = arr(r.slides).map(obj);
    if (!slides.length) add(wrap, h('p', { class: 'muted' }, 'The bot\'s preview has no slides.'));
    slides.forEach(sl => {
      // a slide the bot can't make (the positive pulse): its reason, never an empty slide
      if (sl.unavailable) {
        add(wrap, h('div', { class: 'coverage warn', role: 'note' }, h('b', {}, `${txt(sl.title) || 'This slide'} is not made: `),
          txt(sl.why) || 'the bot did not say why.'));
        return;
      }
      // the bot's answer carries the slide's text exactly as it is written to the deck: drawn in the deck's own boxes
      if (typeof obj(sl.model).body === 'string') {
        add(wrap, deckSlide(sl, { bg, font, tc, bc, ts, bs, plain }));
        return;
      }
      const card = h('div', { class: `slide-card${plain ? ' plain' : ''}`, role: 'group', 'aria-label': `Preview of the slide: ${txt(sl.title)}` });
      if (bg) card.style.background = bg;
      if (font) card.style.fontFamily = `"${font}", var(--font-sans)`;
      if (bc) card.style.color = bc;
      if (bs !== null) card.style.fontSize = `calc(${bs} * var(--pt))`;
      const title = h('div', { class: 'slide-title-txt' }, txt(sl.title) || 'Untitled');
      if (tc) title.style.color = tc;
      title.style.fontSize = ts !== null ? `calc(${ts} * var(--pt))` : 'calc(26 * var(--pt))';
      add(card, title);
      if (txt(sl.windowLabel)) add(card, h('div', { class: 'slide-window' }, txt(sl.windowLabel)));
      const issues = arr(sl.issues).map(obj);
      const list = h('div', { class: 'slide-issues' });
      if (!issues.length && !txt(sl.unnamedLine)) add(list, h('div', { class: 'slide-empty' }, txt(sl.empty) || 'No alerts in this window'));
      issues.forEach(is => {
        const summary = arr(is.summary).map(obj);
        add(list, h('div', { class: 'slide-issue' },
          h('div', {}, h('span', { class: 'slide-issue-name' }, txt(is.name) || 'Not named'), is.foundByApp ? h('span', { class: 'slide-tag' }, 'Found by the app') : null),
          numbersLine(is.numbers),
          summary.length ? h('div', {}, summary.map(seg => (safeUrl(seg.url)
            ? h('a', { href: safeUrl(seg.url), target: '_blank', rel: 'noopener noreferrer' }, String(seg.text === undefined || seg.text === null ? '' : seg.text))
            : String(seg.text === undefined || seg.text === null ? '' : seg.text)))) : null,
          txt(is.status) ? h('div', { class: 'slide-status' }, txt(is.status)) : null));
      });
      if (txt(sl.unnamedLine)) add(list, h('div', { class: 'slide-status' }, issues.length ? `Also ${txt(sl.unnamedLine)}` : txt(sl.unnamedLine)));
      add(card, list);
      // text taller than the slide runs past its bottom edge in the deck: the preview shows where the slide ends and says so
      const over = h('div', { class: 'coverage warn', role: 'alert', hidden: true },
        h('b', {}, 'The text is taller than the slide: '), 'everything below the dashed line runs past the bottom edge of the slide in the deck. ' +
        'Copy the look of a slide with smaller text (Design, above), or make the text smaller in the deck after it is delivered.');
      add(card, h('div', { class: 'slide-end', 'aria-hidden': 'true' }, h('span', {}, 'End of the slide')));
      add(wrap, over, h('div', { class: 'slide-scroll', tabindex: '0', role: 'region', 'aria-label': 'The slide preview (it scrolls sideways on a small screen)' },
        h('div', { class: 'slide-wrap' }, card)));
      watchOverflow(card, over);
    });
    const fitNote = arr(r.slides).map(x => txt(obj(obj(x).fit).note)).filter(Boolean)[0] || '';
    add(wrap, h('p', { class: 'preview-note' }, plain ? `The bot did not send the deck's design values${txt(r.designWhy) ? ` (${txt(r.designWhy)})` : ''}, so this preview uses plain styles; the delivered slide follows the deck.`
      : `Drawn with the deck's own background, font, colours, sizes and text boxes, with the words exactly as they go in. The links are on the phrases the summary cites.${fitNote ? ` On this slide ${fitNote}.` : ''}`));
    return wrap;
  }

  /** A box ({x, y, w, h} in points) from the bot's answer, or `dflt`. Pure. */
  function ptBox(b, dflt) {
    const o = obj(b);
    const v = ['x', 'y', 'w', 'h'].map(k => numOr(o[k]));
    return v.every(x => x !== null) && v[2] > 0 && v[3] > 0 ? { x: v[0], y: v[1], w: v[2], h: v[3] } : dflt;
  }

  /**
   * The body text of the slide's model ({body, bold: [[start, end]], links: [[start, end, url]]}) as text and links,
   * bold where the deck has it bold; only http(s) links are made. Pure but for the DOM.
   */
  function modelRuns(m) {
    const body = String(m.body);
    const bold = arr(m.bold).filter(x => Array.isArray(x));
    const links = arr(m.links).filter(x => Array.isArray(x) && safeUrl(x[2]));
    const cuts = new Set([0, body.length]);
    bold.concat(links).forEach(x => { cuts.add(Math.max(0, Math.min(body.length, Number(x[0]) || 0))); cuts.add(Math.max(0, Math.min(body.length, Number(x[1]) || 0))); });
    const at = Array.from(cuts).sort((a, b) => a - b);
    const out = [];
    for (let i = 0; i < at.length - 1; i++) {
      const a = at[i];
      const z = at[i + 1];
      if (z <= a) continue;
      const piece = body.slice(a, z);
      const isBold = bold.some(x => x[0] <= a && z <= x[1]);
      const link = links.find(x => x[0] <= a && z <= x[1]);
      let el = link ? h('a', { href: safeUrl(link[2]), target: '_blank', rel: 'noopener noreferrer' }, piece) : piece;
      if (isBold) el = h('b', {}, el);
      out.push(el);
    }
    return out;
  }

  /**
   * One slide as it lands in the deck: the page at its own size, the title and the body in the deck's own boxes (from
   * the bot's answer; a new deck's when it can't read them), the body at the size it is written at (fit.bodyPt), the
   * words exactly as written. Text that runs past the page shows past a dashed line, with what to do. Pure but for the DOM.
   */
  function deckSlide(sl, d) {
    const geo = obj(sl.box);
    const pageW = numOr(geo.pageW) || 720;
    const pageH = numOr(geo.pageH) || 405;
    const tb = ptBox(geo.title, { x: 31.1, y: 22.3, w: 657.9, h: 62.6 });
    const bb = ptBox(geo.body, { x: 31.1, y: 90.8, w: 657.9, h: 269.1 });
    const bodyPt = numOr(obj(sl.fit).bodyPt) || d.bs || 18;
    const titlePt = d.ts || 28;
    const m = obj(sl.model);
    const card = h('div', { class: `slide-card slide-card--deck${d.plain ? ' plain' : ''}`, role: 'group', 'aria-label': `Preview of the slide: ${txt(m.title) || txt(sl.title)}` });
    card.style.setProperty('--pw', String(pageW));
    card.style.setProperty('--ph', String(pageH));
    if (d.bg) card.style.background = d.bg;
    if (d.font) card.style.fontFamily = `"${d.font}", var(--font-sans)`;
    if (d.bc) card.style.color = d.bc;
    const place = (el, b) => {
      el.style.left = `calc(${b.x} * var(--pt))`;
      el.style.top = `calc(${b.y} * var(--pt))`;
      el.style.width = `calc(${b.w} * var(--pt))`;
      return el;
    };
    const title = place(h('div', { class: 'slide-box slide-box--title' }, h('div', {}, txt(m.title) || txt(sl.title) || 'Untitled')), tb);
    title.style.height = `calc(${tb.h} * var(--pt))`;
    title.style.fontSize = `calc(${titlePt} * var(--pt))`;
    if (d.tc) title.style.color = d.tc;
    const body = place(h('div', { class: 'slide-box slide-box--body' }, modelRuns(m)), bb);
    body.style.minHeight = `calc(${bb.h} * var(--pt))`;
    body.style.fontSize = `calc(${bodyPt} * var(--pt))`;
    add(card, title, body, h('div', { class: 'slide-end', 'aria-hidden': 'true' }, h('span', {}, 'End of the slide')));
    const over = h('div', { class: 'coverage warn', role: 'alert', hidden: true },
      h('b', {}, 'The text is taller than the slide: '), 'everything below the dashed line runs past the bottom edge of the slide in the deck. ' +
      'Copy the look of a slide with a larger text box (Design, above), or a shorter lookback with fewer alerts.');
    const out = h('div', { style: { display: 'grid', gap: '12px' } }, over,
      h('div', { class: 'slide-scroll', tabindex: '0', role: 'region', 'aria-label': 'The slide preview (it scrolls sideways on a small screen)' }, h('div', { class: 'slide-wrap' }, card)));
    watchDeckOverflow(card, body, over, pageH / pageW);
    return out;
  }

  /**
   * Shows `note` and grows `card` (the dashed line stays at the page's edge) while the body runs past the bottom of the
   * page; checked again whenever the card's size changes (fonts arriving, a narrower window). Never throws.
   */
  function watchDeckOverflow(card, body, note, ratio) {
    const check = () => {
      try {
        if (!card.isConnected) return;
        const page = card.clientWidth * ratio;
        const bottom = body.offsetTop + body.offsetHeight;
        const tall = bottom > page + 1;
        card.classList.toggle('over', tall);
        card.style.height = tall ? `${Math.ceil(bottom + 10)}px` : '';
        note.hidden = !tall;
      } catch (e) { /* the preview stays as drawn */ }
    };
    const soon = () => requestAnimationFrame(check);
    try { if (typeof ResizeObserver === 'function') new ResizeObserver(soon).observe(body); } catch (e) { /* checked below */ }
    soon();
    try { if (document.fonts && document.fonts.ready) document.fonts.ready.then(soon); } catch (e) { /* checked above */ }
  }

  /**
   * Shows `note` and marks the slide's end on `card` while the card's text is taller than a 16:9 slide (checked again
   * whenever its size changes: fonts arriving, a narrower window). Never throws.
   */
  function watchOverflow(card, note) {
    const check = () => {
      try {
        if (!card.isConnected) return;
        const tall = card.scrollHeight > Math.ceil((card.clientWidth * 9) / 16) + 2;
        card.classList.toggle('over', tall);
        note.hidden = !tall;
      } catch (e) { /* the preview stays as drawn */ }
    };
    // the change is made a frame later, never inside the observer's own callback (no resize loop)
    const soon = () => requestAnimationFrame(check);
    try { if (typeof ResizeObserver === 'function') new ResizeObserver(soon).observe(card); } catch (e) { /* checked below */ }
    soon();
    try { if (document.fonts && document.fonts.ready) document.fonts.ready.then(soon); } catch (e) { /* checked above */ }
  }

  /** An issue's numbers line: the bot's own words, or its numbers written out (only those it gives). Pure but for the DOM. */
  function numbersLine(n) {
    if (typeof n === 'string') return txt(n) ? h('div', {}, txt(n)) : null;
    const o = obj(n);
    if (txt(o.text || o.line)) return h('div', {}, txt(o.text || o.line));
    const parts = [];
    if (numOr(o.alerts) !== null) parts.push(pl(o.alerts, 'alert', 'alerts'));
    if (numOr(o.accounts) !== null) parts.push(pl(o.accounts, 'account', 'accounts'));
    if (numOr(o.platforms) !== null) parts.push(pl(o.platforms, 'platform', 'platforms'));
    if (o.engagement !== undefined) parts.push(numOr(o.engagement) !== null ? `${fmt(o.engagement)} engagement` : 'engagement not counted');
    if (txt(o.change)) parts.push(txt(o.change));
    return parts.length ? h('div', {}, parts.join(' · ')) : null;
  }

  /** The Save bar: Save (with what is missing), Cancel, and the save's answer. Pure but for the DOM. */
  function saveBar() {
    const e = S.editor;
    if (!e) return h('div');
    const missing = missingForSave();
    const gate = delivGate();
    const kids = [h('button', { type: 'button', class: 'btn btn--primary btn--lg', disabled: missing.length > 0 || e.saving, 'aria-describedby': missing.length ? 'save-why' : null,
      'data-fk': 'ed:save', on: { click: saveNow } }, e.saving ? 'Saving...' : 'Save'),
    h('button', { type: 'button', class: 'btn btn--lg', on: { click: closeEditor } }, 'Cancel')];
    if (missing.length) kids.push(h('span', { class: 'why-off', id: 'save-why' }, `To save, add ${missing.join(', ')}.`));
    else if (gate.on === false) kids.push(h('span', { class: 'small muted' }, 'It can be saved now; it waits until Slide deliveries (row 55) is ON.'));
    const out = h('div', {}, h('div', { class: 'save-bar' }, kids));
    if (e.saveErr) add(out, inlineProblem(null, e.saveErr));
    else if (e.saveResp && obj(e.saveResp).ok !== true) add(out, inlineProblem(e.saveResp));
    return out;
  }

  /** Draws the Save bar again in place (after a typed change). Never throws. */
  function refreshSaveBar() {
    const bar = $('#save-bar');
    if (!bar || !S.editor) return;
    const keep = rememberFocus();
    bar.replaceChildren(saveBar());
    restoreFocus(keep);
  }

  /** Saves the delivery (dashSaveDelivery): works while row 55 is OFF (it waits). Never throws. */
  function saveNow() {
    const e = S.editor;
    if (!e || e.saving || missingForSave().length) return;
    e.saving = true;
    e.saveErr = null;
    e.saveResp = null;
    refreshSaveBar();
    call('dashSaveDelivery', settingsOut()).then(r => {
      if (S.editor !== e) return;
      e.saving = false;
      if (r && r.ok === true) {
        S.editor = null;
        toast(txt(r.note) || (delivGate().on === false ? 'Saved. It waits until Slide deliveries (row 55) is ON.' : 'Saved.'));
        loadDeliveries();
      } else {
        e.saveResp = r;
        refreshSaveBar();
      }
    }, err => {
      if (S.editor !== e) return;
      e.saving = false;
      e.saveErr = err;
      refreshSaveBar();
    });
  }

  /** Checks the deck (dashDeckCheck): edit access, the bot account to share with, its slides. Keeps a saved spot when its slides are still there. Never throws. */
  function checkDeck() {
    const e = S.editor;
    if (!e || e.checking) return;
    const url = txt(e.s.deck.url);
    if (!/^https?:\/\//i.test(url)) {
      e.check = { ok: false, why: 'Paste the deck\'s full link, starting with https://docs.google.com/presentation/.' };
      e.checkErr = null;
      renderSlides();
      return;
    }
    e.checking = true;
    e.checkErr = null;
    renderSlides();
    call('dashDeckCheck', url).then(r => {
      if (S.editor !== e) return;
      e.checking = false;
      e.check = r;
      if (r && r.ok === true) {
        const deck = obj(r.deck);
        e.s.deck = { id: txt(deck.id), url: txt(deck.url) || url, title: txt(deck.title) };
        if (!txt(e.s.name) && txt(deck.title)) e.s.name = txt(deck.title);
        const ids = new Set(arr(r.slides).map(x => txt(obj(x).id)));
        const sp = obj(e.s.spot);
        if (e.s.spot && !(ids.has(txt(sp.afterId)) || ids.has(txt(sp.beforeId)))) { e.s.spot = null; e.spotLost = true; }
        if (e.s.design.mode === 'copy' && txt(e.s.design.slideId) && !ids.has(txt(e.s.design.slideId))) e.s.design.slideId = '';
      }
      renderSlides();
    }, err => {
      if (S.editor !== e) return;
      e.checking = false;
      e.checkErr = err;
      renderSlides();
    });
  }

  // -----------------------------------------------------------------------------------------------------------------
  // Start
  // -----------------------------------------------------------------------------------------------------------------

  /** Wires the header, restores the viewer's choices, and asks the bot for the first answers. Never throws. */
  function start() {
    applyTheme(themeChoice(), false);
    document.querySelectorAll('[data-theme-choice]').forEach(b => b.addEventListener('click', () => applyTheme(b.getAttribute('data-theme-choice'), true)));
    const cyc = $('#theme-cycle');
    if (cyc) cyc.addEventListener('click', () => applyTheme(THEME_NEXT[themeChoice()] || 'light', true));
    const v = lsGet('view');
    if (VIEWS.some(x => x.key === v)) S.view = v;
    const ms = lsGet('mapSize');
    if (ms === 'accounts' || ms === 'posts' || ms === 'engagement') S.map.size = ms;
    const mc = lsGet('mapColor');
    if (mc === 'level' || mc === 'speed' || mc === 'platform') S.map.color = mc;
    const areaTabs = [document.getElementById('area-tab-live'), document.getElementById('area-tab-slides')];
    areaTabs.forEach((t, i) => {
      t.addEventListener('click', () => setArea(i === 0 ? 'live' : 'slides'));
      t.addEventListener('keydown', ev => tabKeys(ev, areaTabs, j => setArea(j === 0 ? 'live' : 'slides', true)));
    });
    $('#refresh-btn').addEventListener('click', () => { if (S.area === 'slides') loadDeliveries(); else loadSnapshot(true); });
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && S.area === 'live' && !S.loading && sinceLoaded() >= REFRESH_MS) loadSnapshot(false);
    });
    let lastTick = wallNow();
    setInterval(() => {
      // the device's clock jumped past a few ticks: it slept (the page clock stood still), so ask the bot at once
      const woke = wallNow() - lastTick > 3 * TICK_MS;
      lastTick = wallNow();
      updateFresh();
      // what the page shows became too old (or fresh again): the Now strip and the answers say so at once
      if (S.snap && S.area === 'live' && staleness().stale !== !!S.drawnStale) { redrawNow(); redrawQuestions(); }
      if (document.visibilityState === 'visible' && S.area === 'live' && !S.loading && S.loadedAt && (woke || sinceLoaded() >= REFRESH_MS)) loadSnapshot(false);
    }, TICK_MS);
    loadSnapshot(false);
    if (lsGet('area') === 'slides') setArea('slides');
  }

  start();
})();
</script>
