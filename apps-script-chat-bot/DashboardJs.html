<script>
/*
 * DashboardJs.html — the live dashboard web app's behaviour (Control row 54, Live dashboard; row 55, Slide
 * deliveries). Included by DashboardPage.html.
 *
 * The page asks the bot through google.script.run only (withSuccessHandler / withFailureHandler): dashSnapshot,
 * dashDetail, dashWhyNot (DashboardData.gs, read-only), and dashDeliveries, dashDeckCheck, dashScheduleCheck,
 * dashPreview, dashSaveDelivery, dashRunNow, dashSetDeliveryStatus (SlideDeliveries.gs). Every number and word about
 * the bot's work on screen comes from those answers; nothing is made up, estimated or shown as a sample. A missing
 * value is said to be missing. An answer {ok: false, denied | off | why} is shown in plain words with what to do.
 *
 * Every "Updated 14 s ago" and "3 min ago" counts from the bot's own clock (each answer's servedAt, plus the time
 * passed since it arrived on this page's monotonic clock), never from the device's clock, which can be wrong.
 *
 * Text from the bot is always put on the page as text (never as markup); links open in a new tab and only http(s)
 * links are made. The viewer's theme, area, view and map choices are remembered in localStorage (per viewer, inside
 * try/catch: the page works the same without it). The Live area asks again every 60 seconds while the page is visible.
 */
(function () {
  'use strict';

  // -----------------------------------------------------------------------------------------------------------------
  // Words and constants
  // -----------------------------------------------------------------------------------------------------------------

  const REFRESH_MS = 60 * 1000;
  const TICK_MS = 5 * 1000;
  // what the page shows is past this age (the bot runs every minute; DashboardData.gs DL_RUN_OK_MS_): never shown as calm
  const STALE_MS = 5 * 60 * 1000;
  // how long a call to the bot may take before the page gives up on it (a preview or a run can take minutes)
  const CALL_TIMEOUT_MS = { dashPreview: 330 * 1000, dashRunNow: 330 * 1000, '': 90 * 1000 };
  const LEVELS = ['critical', 'high', 'medium', 'low'];
  const LEVEL_WORDS = { critical: 'Critical', high: 'High', medium: 'Medium', low: 'Low', unknown: 'Can\'t be sure' };
  const LEVEL_RANK = { critical: 4, high: 3, medium: 2, low: 1, unknown: 0 };
  const SPEEDS = ['surging', 'rising', 'steady', 'slowing', 'unknown'];
  const SPEED_WORDS = { surging: 'Surging', rising: 'Rising', steady: 'Steady', slowing: 'Slowing', unknown: 'Speed not known' };
  const CLUSTER_STATUS = {
    forming: { label: 'Forming', tone: 'st-info' },
    'at the bar': { label: 'At the bar for a card', tone: 'st-warn' },
    carded: { label: 'Carded', tone: 'st-good' },
    held: { label: 'Held back', tone: 'st-plain' },
  };
  const STATUS_TONE = {
    'needs-review': 'st-info', 'needs-person': 'st-bad', 'fix-asked': 'st-warn', 'draft-waiting': 'st-warn', sent: 'st-good', tns: 'st-good',
    'no-action': 'st-plain', failed: 'st-bad', superseded: 'st-plain', done: 'st-plain',
  };
  const KIND_WORDS = {
    burson: 'Burson\'s alert', watch: 'Watch alert', direct: 'Direct BigQuery card', story: 'Story card',
    update: 'Story update', early: 'Early signal', other: 'Other format', sheet: 'Sheet test',
  };
  const ITEM_KIND_WORDS = { alert: 'Alert', cluster: 'Story forming', health: 'The bot\'s health', stuck: 'Stuck' };
  const VIEWS = [
    { key: 'map', label: 'Story map' },
    { key: 'alerts', label: 'Alerts' },
    { key: 'pressure', label: 'Pressure' },
    { key: 'pipeline', label: 'Pipeline' },
    { key: 'early', label: 'Caught early' },
    { key: 'held', label: 'Held back' },
  ];
  const VIEW_GO_WORDS = {
    map: 'Show on the Story map', alerts: 'Show in Alerts', pressure: 'Show Pressure', pipeline: 'Show in Pipeline',
    early: 'Show Caught early', held: 'Show Held back', health: 'See each source', now: 'Show what needs a person',
    whynot: 'Look up a post',
  };
  const SOURCE_STATE = {
    fresh: { label: 'Current', tone: 'st-good' }, late: { label: 'Late', tone: 'st-warn' },
    off: { label: 'Off', tone: 'st-plain' }, missing: { label: 'No record', tone: 'st-bad' },
  };
  const FIELD_WORDS = {
    issue_name: 'Issue name', issue_status: 'Issue status', product: 'Product', other_products: 'Other products',
    exposure_tag: 'Exposure Tag', priority: 'Priority', risk_tags: 'Sensitive topics', kof: 'KOF', kof_lists: 'KOF lists',
    engagement_level: 'Engagement level', total_engagement: 'Total engagement', social_network: 'Platform', author: 'Author',
    post_url: 'Post', post_date: 'Posted', summary: 'Summary',
  };
  const DAY_ORDER = [1, 2, 3, 4, 5, 6, 0];
  const DAY_SHORT = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  const DAY_LONG = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  // the lookback slider's stops, in hours: finer where a few hours matter, coarser out to 30 days
  const LOOKBACK_STOPS = [1, 2, 3, 4, 6, 8, 12, 18, 24, 36, 48, 72, 96, 120, 168, 240, 336, 504, 720];
  // what Slide deliveries says when the bot's answer gives no reason of its own (the Control tab's row 55 texts)
  const DELIV_OFF_WHY = 'Slide deliveries is OFF on the Control tab (row 55): no pulse slides are delivered. Deliveries can be set up here and wait; Preview and Run now work once it is ON.';
  const DELIV_SCOPE_WHY = 'The bot\'s account has not yet approved editing Google Slides (once; see the README, "Slide deliveries"). Until then Preview and Run now can\'t work.';
  const POSITIVE_WHY = 'Not available: the source of the positive pulse is not known yet (the owner has been asked). The setting is kept; no positive slide is made from any other source.';

  const ICONS = {
    close: 'M6 6l12 12M18 6L6 18',
    ext: 'M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5',
    chevron: 'M6 9l6 6 6-6',
    arrow: 'M5 12h14M13 6l6 6-6 6',
    back: 'M19 12H5M11 18l-6-6 6-6',
    search: 'M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14zM20 20l-4-4',
    play: 'M8 5.5v13l11-6.5z',
    pause: 'M9 5v14M15 5v14',
    edit: 'M4 20h4L19 9l-4-4L4 16v4z',
    plus: 'M12 5v14M5 12h14',
    info: 'M12 8h.01M11 12h1v5h1M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18z',
    refresh: 'M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7',
    eye: 'M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12zM12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6z',
  };

  // -----------------------------------------------------------------------------------------------------------------
  // State
  // -----------------------------------------------------------------------------------------------------------------

  const S = {
    area: 'live',
    snap: null, snapErr: null, snapRefusal: null, loading: false, loadedAt: 0, loadedWall: 0, refreshFailed: null,
    view: 'map', question: null, sourcesOpen: false, runLogOpen: false, canSeeOpen: -1, canSeeList: false, pipelineFlash: false,
    map: { filter: 'all', size: 'accounts', color: 'level', focus: '' },
    alerts: { q: '', status: '', level: '', kind: '', flow: '', sort: 'newest', corrected: false },
    held: 'today',
    drawer: null,
    dialog: null,
    deliv: { loaded: false, loading: false, resp: null, err: null, results: {} },
    editor: null,
  };
  // the bot's clock as its last answer told it: {at: the bot's ms, perf: this page's performance.now() then, wall: the
  // device's clock then (performance.now() stands still while the device sleeps; the device's clock does not)}
  const BOT_CLOCK = { at: 0, perf: 0, wall: 0 };
  const reduceMotion = (function () {
    try { return window.matchMedia('(prefers-reduced-motion: reduce)'); } catch (e) { return { matches: false }; }
  })();
  let mapObserver = null;

  // -----------------------------------------------------------------------------------------------------------------
  // Small helpers
  // -----------------------------------------------------------------------------------------------------------------

  /** The first element matching `sel`. Pure but for the DOM. */
  function $(sel, root) {
    return (root || document).querySelector(sel);
  }

  /** Sets attributes on `el`: class, text, on (event handlers), style (object), aria-* (as strings), the rest as given. Never throws. */
  function applyAttrs(el, attrs) {
    if (!attrs) return;
    Object.keys(attrs).forEach(k => {
      const v = attrs[k];
      if (v === undefined || v === null) return;
      if (k.indexOf('aria-') === 0) { el.setAttribute(k, String(v)); return; }
      if (v === false) return;
      if (k === 'class') el.setAttribute('class', String(v));
      else if (k === 'text') el.textContent = String(v);
      else if (k === 'on') Object.keys(v).forEach(ev => el.addEventListener(ev, v[ev]));
      else if (k === 'style' && typeof v === 'object') Object.keys(v).forEach(p => el.style.setProperty(p, v[p]));
      else if (k === 'hidden' || k === 'disabled' || k === 'checked' || k === 'selected' || k === 'required') el[k] = !!v;
      else if (k === 'value') el.value = String(v);
      else el.setAttribute(k, v === true ? '' : String(v));
    });
  }

  /** Appends children: strings and numbers become text, arrays are flattened, null and false are skipped. Never throws. */
  function appendKids(el, kids) {
    (kids || []).forEach(k => {
      if (k === undefined || k === null || k === false || k === '') return;
      if (Array.isArray(k)) appendKids(el, k);
      else if (typeof k === 'string' || typeof k === 'number') el.appendChild(document.createTextNode(String(k)));
      else el.appendChild(k);
    });
  }

  /** Appends children to `el` the way h() does (arrays flattened; null, false and '' skipped). Returns `el`. Never throws. */
  function add(el) {
    appendKids(el, Array.prototype.slice.call(arguments, 1));
    return el;
  }

  /** An HTML element; text is always text, never markup. Pure but for the DOM. */
  function h(tag, attrs) {
    const el = document.createElement(tag);
    applyAttrs(el, attrs);
    appendKids(el, Array.prototype.slice.call(arguments, 2));
    return el;
  }

  /** An SVG element (attributes as strings). Pure but for the DOM. */
  function sv(tag, attrs) {
    const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
    Object.keys(attrs || {}).forEach(k => {
      const v = attrs[k];
      if (v === undefined || v === null || v === false) return;
      if (k === 'on') Object.keys(v).forEach(ev => el.addEventListener(ev, v[ev]));
      else if (k === 'style' && typeof v === 'object') Object.keys(v).forEach(p => el.style.setProperty(p, v[p]));
      else el.setAttribute(k, String(v));
    });
    appendKids(el, Array.prototype.slice.call(arguments, 2));
    return el;
  }

  /** A line icon (decorative: hidden from screen readers). Pure but for the DOM. */
  function icon(name, cls) {
    return sv('svg', { viewBox: '0 0 24 24', 'aria-hidden': 'true', focusable: 'false', fill: 'none', stroke: 'currentColor',
      'stroke-width': 2, 'stroke-linecap': 'round', 'stroke-linejoin': 'round', class: `ico${cls ? ` ${cls}` : ''}` }, sv('path', { d: ICONS[name] || '' }));
  }

  /** `v` when it is a plain object, else {}. Pure. */
  function obj(v) {
    return v && typeof v === 'object' && !Array.isArray(v) ? v : {};
  }

  /** `v` when it is an array, else []. Pure. */
  function arr(v) {
    return Array.isArray(v) ? v : [];
  }

  /** A value as one line of text ('' for none). Pure. */
  function txt(v) {
    return v === undefined || v === null ? '' : String(v).replace(/\s+/g, ' ').trim();
  }

  /** A finite number, or null. Pure. */
  function numOr(v) {
    if (v === undefined || v === null || v === '' || typeof v === 'boolean') return null;
    const n = Number(v);
    return isFinite(n) ? n : null;
  }

  /** A number written for people (1,234), or `none` when it is not a number. Pure. */
  function fmt(v, none) {
    const n = numOr(v);
    return n === null ? (none === undefined ? 'not kept' : none) : n.toLocaleString('en-US');
  }

  /** "1 alert" / "3 alerts". Pure. */
  function pl(n, one, many) {
    const x = numOr(n);
    return `${fmt(x, '0')} ${x === 1 ? one : many}`;
  }

  /** An http(s) link, or '' for anything else (never a javascript: or data: link). Pure. */
  function safeUrl(u) {
    const t = String(u || '').trim();
    return /^https?:\/\/[^\s<>"']+$/i.test(t) ? t : '';
  }

  /** A link that opens in a new tab (with words for screen readers saying so); plain text when the link is not http(s). Pure but for the DOM. */
  function extLink(url, text, cls) {
    const u = safeUrl(url);
    if (!u) return h('span', { class: cls || '' }, text);
    return h('a', { href: u, target: '_blank', rel: 'noopener noreferrer', class: cls || '' },
      text, icon('ext', 'icon-inline'), h('span', { class: 'sr-only' }, ' (opens in a new tab)'));
  }

  /** "14 s ago", "3 min ago", "2 h ago", "4 days ago" for an elapsed time in ms ('' when unknown). Pure. */
  function agoWords(ms) {
    const n = numOr(ms);
    if (n === null) return '';
    const s = Math.max(0, Math.round(n / 1000));
    if (s < 60) return `${s} s ago`;
    const m = Math.round(s / 60);
    if (m < 60) return `${m} min ago`;
    const hr = Math.round(m / 60);
    if (hr < 48) return `${hr} h ago`;
    const d = Math.round(hr / 24);
    return `${d} days ago`;
  }

  /** This page's monotonic clock in ms (it never jumps when the device's clock is set). Never throws. */
  function perfNow() {
    try { return window.performance.now(); } catch (e) { return Date.now(); }
  }

  /** The device's clock in ms (only ever used for time passed, never for a moment). Never throws. */
  function wallNow() {
    try { return Date.now(); } catch (e) { return 0; }
  }

  /**
   * The ms passed since a moment noted as (perf, wall): the larger of what the page clock and the device clock say
   * (the page clock stands still while the device sleeps, so after waking only the device clock knows). Never throws.
   */
  function elapsed(perf, wall) {
    return Math.max(0, perfNow() - perf, wall ? wallNow() - wall : 0);
  }

  /** Notes the bot's clock from an answer (servedAt; a snapshot without it: its asOf). Never throws. */
  function noteBotClock(r) {
    const x = obj(r);
    const at = numOr(x.servedAt !== undefined ? x.servedAt : x.asOf);
    if (at !== null && at > 0) { BOT_CLOCK.at = at; BOT_CLOCK.perf = perfNow(); BOT_CLOCK.wall = wallNow(); }
  }

  /** The bot's clock now (ms): its last answer's time plus the time passed since; null before any answer. Never throws. */
  function botNow() {
    return BOT_CLOCK.at ? BOT_CLOCK.at + elapsed(BOT_CLOCK.perf, BOT_CLOCK.wall) : null;
  }

  /** Notes that the Live answer (or its failure) came now. Never throws. */
  function markLoaded() {
    S.loadedAt = perfNow();
    S.loadedWall = wallNow();
  }

  /** The ms since the Live answer (or its failure) came. Never throws. */
  function sinceLoaded() {
    return elapsed(S.loadedAt, S.loadedWall);
  }

  /** How long before the bot's clock now the moment `at` (ms) was ('' when unknown). Never the device's clock. Never throws. */
  function since(at) {
    const n = numOr(at);
    const now = botNow();
    return n === null || n <= 0 || now === null ? '' : agoWords(now - n);
  }

  /** A moment (ms) as "Nov 17, 9:05 AM" on this device, or in time zone `tz` with its short name. '' when unknown. Never throws. */
  function clock(at, tz) {
    const n = numOr(at);
    if (n === null || n <= 0) return '';
    const opts = { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' };
    if (tz) { opts.timeZone = tz; opts.timeZoneName = 'short'; }
    try { return new Intl.DateTimeFormat('en-US', opts).format(new Date(n)); } catch (e) { return new Date(n).toLocaleString(); }
  }

  /** A time element: "3 min ago", with the full moment as its title. Pure but for the DOM. */
  function timeEl(at) {
    const n = numOr(at);
    if (n === null || n <= 0) return h('span', { class: 'muted' }, 'time not kept');
    return h('time', { datetime: new Date(n).toISOString(), title: clock(n) }, since(n) || clock(n));
  }

  /** The device's IANA time zone ('' when the browser does not say). Never throws. */
  function deviceTz() {
    try { return Intl.DateTimeFormat().resolvedOptions().timeZone || ''; } catch (e) { return ''; }
  }

  /** localStorage read (per viewer); null when storage is blocked or empty. Never throws. */
  function lsGet(key) {
    try { return window.localStorage.getItem(`dash1.${key}`); } catch (e) { return null; }
  }

  /** localStorage write (per viewer); nothing happens when storage is blocked. Never throws. */
  function lsSet(key, value) {
    try { window.localStorage.setItem(`dash1.${key}`, String(value)); } catch (e) { /* not remembered */ }
  }

  /** The level when it is one of the scale's words, else 'unknown'. Pure. */
  function levelOf(l) {
    return Object.prototype.hasOwnProperty.call(LEVEL_WORDS, l) ? l : 'unknown';
  }

  /** A seriousness pill (word and colour, with a dot). Pure but for the DOM. */
  function levelPill(level, extraCls) {
    const lv = levelOf(level);
    return h('span', { class: `pill lv-${lv} ${extraCls || ''}` }, h('span', { class: 'dot', 'aria-hidden': 'true' }),
      h('span', { class: 'sr-only' }, 'Seriousness: '), LEVEL_WORDS[lv]);
  }

  /** An alert's status pill ({key, label, derived}). Pure but for the DOM. */
  function statusPill(st) {
    const s = obj(st);
    const key = txt(s.key);
    const label = txt(s.label) || key || 'Status not kept';
    return h('span', { class: `pill ${STATUS_TONE[key] || 'st-plain'}`, title: s.derived ? 'Worked out from what the alert\'s row keeps' : null }, label);
  }

  /** A story's status pill. Pure but for the DOM. */
  function clusterStatusPill(status) {
    const c = CLUSTER_STATUS[status] || { label: txt(status) || 'Status not kept', tone: 'st-plain' };
    return h('span', { class: `pill ${c.tone}` }, c.label);
  }

  /** The words of an error, one line. Pure. */
  function errWords(e) {
    const m = txt((e && e.message) || e);
    return m || 'no reason was given';
  }

  /** Scrolls `el` into view (instantly when motion is reduced). Never throws. */
  function scrollToEl(el) {
    if (!el) return;
    try { el.scrollIntoView({ behavior: reduceMotion.matches ? 'auto' : 'smooth', block: 'start' }); } catch (e) { el.scrollIntoView(); }
  }

  /** Shows a short message at the bottom of the screen for a few seconds. Never throws. */
  function toast(message) {
    const el = $('#toast');
    if (!el) return;
    el.textContent = message;
    el.classList.remove('hidden');
    clearTimeout(toast.t);
    toast.t = setTimeout(() => el.classList.add('hidden'), 6000);
  }

  /** The focused element's focus key (data-fk) and caret, to give focus back after a part of the page is drawn again. Never throws. */
  function rememberFocus() {
    const a = document.activeElement;
    const k = a && a.getAttribute ? a.getAttribute('data-fk') : null;
    if (!k) return null;
    let sel = null;
    try { sel = typeof a.selectionStart === 'number' ? [a.selectionStart, a.selectionEnd] : null; } catch (e) { sel = null; }
    return { k, sel };
  }

  /** Gives focus back to the element with the remembered focus key. Never throws. */
  function restoreFocus(m) {
    if (!m) return;
    const el = Array.prototype.find.call(document.querySelectorAll('[data-fk]'), x => x.getAttribute('data-fk') === m.k);
    if (!el) return;
    try {
      el.focus({ preventScroll: true });
      if (m.sel && el.setSelectionRange) el.setSelectionRange(m.sel[0], m.sel[1]);
    } catch (e) { /* focus stays where it is */ }
  }

  // -----------------------------------------------------------------------------------------------------------------
  // The bot (google.script.run)
  // -----------------------------------------------------------------------------------------------------------------

  /**
   * Calls the bot's function `fn` with `args` through google.script.run: a promise of its answer (an object; an empty
   * answer becomes {ok: false, why}), rejected with the Error when the call itself fails, or when no answer comes within
   * CALL_TIMEOUT_MS (an answer after that is let go). Never throws.
   */
  function call(fn) {
    const args = Array.prototype.slice.call(arguments, 1);
    return new Promise((resolveIn, rejectIn) => {
      let done = false;
      const wait = CALL_TIMEOUT_MS[fn] || CALL_TIMEOUT_MS[''];
      const timer = setTimeout(() => {
        if (done) return;
        done = true;
        rejectIn(new Error(`the bot did not answer within ${Math.round(wait / 1000)} seconds`));
      }, wait);
      const resolve = r => { if (done) return; done = true; clearTimeout(timer); resolveIn(r); };
      const reject = e => { if (done) return; done = true; clearTimeout(timer); rejectIn(e); };
      let run = null;
      try { run = window.google && window.google.script && window.google.script.run; } catch (e) { run = null; }
      if (!run) {
        reject(new Error('this page was opened outside the bot\'s web app, so it can\'t ask the bot (google.script.run is missing)'));
        return;
      }
      try {
        const runner = run.withSuccessHandler(r => { if (done) return; noteBotClock(r); resolve(r && typeof r === 'object' ? r : { ok: false, why: 'The bot sent back an empty answer.' }); })
          .withFailureHandler(e => reject(e instanceof Error ? e : new Error(errWords(e))));
        if (typeof runner[fn] !== 'function') throw new Error(`the bot has no ${fn} yet (this link may run an older version)`);
        runner[fn].apply(runner, args);
      } catch (e) {
        reject(e instanceof Error ? e : new Error(errWords(e)));
      }
    });
  }

  /** What to show for an answer {ok: false, denied | off | why}: a titled notice with what to do and a button to try again. Pure but for the DOM. */
  function refusalBlock(r, retry, what) {
    const x = obj(r);
    let title = `The dashboard could not get ${what || 'this'}`;
    let why = txt(x.why) || 'The bot did not say why.';
    let todo = 'Press Try again in a minute. If it keeps happening, tell the owner of the bot\'s sheet.';
    if (x.denied) {
      title = 'You can\'t see this yet';
      todo = 'Once the bot\'s sheet is shared with you, press Try again (it can take up to 10 minutes to let you in).';
    } else if (x.off) {
      title = what === 'the deliveries' ? 'Slide deliveries is OFF' : 'The live dashboard is OFF';
      todo = 'Once it is ON, press Try again.';
    } else if (txt(x.todo)) {
      todo = txt(x.todo);  // the bot's own next step for this answer (trying again would not help)
    }
    return h('div', { class: 'notice panel glass', role: 'alert' },
      h('h2', {}, title), h('p', {}, why), h('p', { class: 'muted' }, h('b', {}, 'What to do: '), todo),
      h('div', { class: 'answer-actions' }, h('button', { type: 'button', class: 'btn btn--primary', on: { click: retry } }, icon('refresh'), 'Try again')));
  }

  /** What to show when a call to the bot failed outright (the Error): what happened and what to do. Pure but for the DOM. */
  function failBlock(e, retry, what) {
    return h('div', { class: 'notice panel glass', role: 'alert' },
      h('h2', {}, `The dashboard could not reach the bot for ${what || 'this'}`),
      h('p', {}, `What happened: ${errWords(e)}.`),
      h('p', { class: 'muted' }, h('b', {}, 'What to do: '), 'press Try again. If it keeps failing, the owner of the bot checks that the web app is deployed (README, "Live dashboard").'),
      h('div', { class: 'answer-actions' }, h('button', { type: 'button', class: 'btn btn--primary', on: { click: retry } }, icon('refresh'), 'Try again')));
  }

  /** An inline note for a failed or refused small call (a check, a preview, a save). Pure but for the DOM. */
  function inlineProblem(r, e) {
    if (e) return h('div', { class: 'coverage warn', role: 'alert' }, `The bot could not be reached: ${errWords(e)}. Try again in a minute.`);
    const x = obj(r);
    return h('div', { class: 'coverage warn', role: 'alert' }, txt(x.why) || 'The bot did not say why it could not do this.');
  }

  // -----------------------------------------------------------------------------------------------------------------
  // Theme and areas
  // -----------------------------------------------------------------------------------------------------------------

  const THEME_NEXT = { device: 'light', light: 'dark', dark: 'device' };

  /** The viewer's theme choice: 'device', 'light' or 'dark'. Never throws. */
  function themeChoice() {
    const t = lsGet('theme');
    return t === 'light' || t === 'dark' ? t : 'device';
  }

  /** Applies a theme choice (and remembers it): Device follows prefers-color-scheme; Light and Dark set html[data-theme]. Never throws. */
  function applyTheme(choice, remember) {
    const root = document.documentElement;
    if (choice === 'light' || choice === 'dark') root.setAttribute('data-theme', choice);
    else root.removeAttribute('data-theme');
    document.querySelectorAll('[data-theme-choice]').forEach(b => b.setAttribute('aria-pressed', String(b.getAttribute('data-theme-choice') === choice)));
    // the phone's one button: shows the choice and moves to the next one
    const cyc = $('#theme-cycle');
    if (cyc) {
      const words = { device: 'Device', light: 'Light', dark: 'Dark' };
      const next = THEME_NEXT[choice] || 'light';
      cyc.setAttribute('data-choice', choice in words ? choice : 'device');
      cyc.setAttribute('aria-label', `Colour theme: ${words[choice] || 'Device'}. Press for ${words[next]}.`);
      cyc.setAttribute('title', `Colour theme: ${words[choice] || 'Device'} (press for ${words[next]})`);
    }
    if (remember) lsSet('theme', choice);
  }

  /** Shows one area (Live or Slide deliveries) and loads what it needs the first time. Never throws. */
  function setArea(area, focusTab) {
    S.area = area === 'slides' ? 'slides' : 'live';
    lsSet('area', S.area);
    [['live', 'area-tab-live', 'area-live'], ['slides', 'area-tab-slides', 'area-slides']].forEach(([key, tabId, panelId]) => {
      const tab = document.getElementById(tabId);
      const on = S.area === key;
      tab.setAttribute('aria-selected', String(on));
      tab.setAttribute('tabindex', on ? '0' : '-1');
      document.getElementById(panelId).hidden = !on;
      if (on && focusTab) tab.focus();
    });
    if (S.area === 'slides') {
      if (!S.deliv.loaded && !S.deliv.loading) loadDeliveries();
      else renderSlides();
    } else if (!S.loading && sinceLoaded() >= REFRESH_MS) {
      loadSnapshot(false);
    }
    renderBanners();
    updateFresh();
  }

  /** Arrow keys, Home and End move between the tabs of a tablist (and select the tab). Never throws. */
  function tabKeys(ev, tabs, select) {
    const i = tabs.indexOf(ev.currentTarget);
    let j = -1;
    if (ev.key === 'ArrowRight' || ev.key === 'ArrowDown') j = (i + 1) % tabs.length;
    else if (ev.key === 'ArrowLeft' || ev.key === 'ArrowUp') j = (i - 1 + tabs.length) % tabs.length;
    else if (ev.key === 'Home') j = 0;
    else if (ev.key === 'End') j = tabs.length - 1;
    if (j < 0) return;
    ev.preventDefault();
    select(j);
  }

  /** The mode chip in the header: Testing / LIVE / not known, as the bot last wrote it on the Control tab. Never throws. */
  function renderMode() {
    const el = $('#mode-chip');
    if (!el) return;
    el.replaceChildren();
    if (!S.snap) return;
    const m = S.snap.mode;
    const title = 'The bot\'s mode as it last wrote it on the Control tab (C29). While Testing, emails go only to the testers in B30.';
    const word = h('span', { class: 'mode-word' }, 'Mode: ');
    if (m === 'testing') add(el, h('span', { class: 'pill st-warn', title }, word, 'Testing'));
    else if (m === 'live') add(el, h('span', { class: 'pill st-info', title }, word, 'LIVE'));
    else add(el, h('span', { class: 'pill st-plain', title }, word, 'not known'));
  }

  // -----------------------------------------------------------------------------------------------------------------
  // Live: loading, banners, freshness
  // -----------------------------------------------------------------------------------------------------------------

  /** Asks the bot for the Live snapshot (refresh: build it anew, past the bot's 45-second cache) and draws the answer. Never throws. */
  function loadSnapshot(refresh) {
    if (S.loading) return;
    S.loading = true;
    setRefreshBusy(true);
    call('dashSnapshot', { refresh: !!refresh }).then(r => {
      S.loading = false;
      setRefreshBusy(false);
      if (r && r.ok === true) {
        S.snap = r;
        S.snapErr = null;
        S.snapRefusal = null;
        S.refreshFailed = null;
        markLoaded();
      } else if (r && (r.denied || r.off)) {
        // access taken away, or the switch turned OFF: the page shows nothing of the bot's work any more
        S.snap = null;
        S.snapRefusal = r;
        markLoaded();
      } else if (S.snap) {
        S.refreshFailed = { why: txt(r && r.why) || 'The bot did not say why.' };
        markLoaded();
      } else {
        S.snapRefusal = r || {};
        markLoaded();
      }
      renderLive();
      renderBanners();
      renderMode();
    }, e => {
      S.loading = false;
      setRefreshBusy(false);
      markLoaded();
      if (S.snap) S.refreshFailed = { why: `the bot could not be reached (${errWords(e)})` };
      else S.snapErr = e;
      renderLive();
      renderBanners();
    });
  }

  /** The Refresh button's busy state. Never throws. */
  function setRefreshBusy(busy) {
    const b = $('#refresh-btn');
    if (!b) return;
    b.setAttribute('aria-busy', String(!!busy));
    b.disabled = !!busy;
    const label = b.querySelector('span');
    if (label) label.textContent = busy ? 'Refreshing' : 'Refresh';
  }

  /** The deployment id of this link, when the bot's answer gives it or its /exec link (…/macros/s/<id>/exec). '' otherwise. Pure. */
  function deployIdOf(build) {
    const b = obj(build);
    const id = txt(b.deployId || b.deploymentId);
    if (/^[A-Za-z0-9_-]{10,}$/.test(id)) return id;
    // https://script.google.com/macros/s/<id>/exec, or for a Workspace domain .../a/macros/<domain>/s/<id>/exec
    const m = txt(b.url || b.link).match(/\/macros\/(?:[^/?#]+\/)?s\/([A-Za-z0-9_-]{10,})\/exec\b/);
    return m ? m[1] : '';
  }

  /** The banners at the top (warnings first): this link is older than the bot; the last refresh failed. Never throws. */
  function renderBanners() {
    const root = $('#banners');
    if (!root) return;
    root.replaceChildren();
    const b = S.snap && obj(S.snap.build);
    if (b && b.behind === true) {
      const id = deployIdOf(b);
      const how = id ? [h('code', { class: 'cmd' }, `clasp deploy -i ${id}`)]
        : [h('code', { class: 'cmd' }, 'clasp deploy -i <deployment id>'), ', with the deployment id that ', h('code', { class: 'cmd' }, 'clasp deployments'), ' lists for the web app'];
      add(root, h('div', { class: 'banner', role: 'status' }, icon('info'),
        h('div', { class: 'banner-text' },
          h('strong', {}, 'This link runs an older version than the bot. '),
          `This link runs ${txt(b.web) || 'a version that is not named'}; the bot runs ${txt(b.bot) || 'a version that is not named'}, so parts of this page may be missing or out of date. `,
          h('b', {}, 'What to do: '), 'the owner of the bot runs ', how, ' in the bot\'s folder (apps-script-chat-bot); then reload this page.')));
    }
    const acct = S.snap ? obj(S.snap.build) : obj(S.deliv.resp);
    if (acct.sameAccount === false) {
      // the bot's words start with the same sentence: the bold lead only when they are missing
      add(root, h('div', { class: 'banner banner--bad', role: 'alert' }, icon('info'),
        h('div', { class: 'banner-text' }, txt(acct.accountWhy) ? txt(acct.accountWhy)
          : [h('strong', {}, 'This web app runs as a different Google account than the bot. '),
            'The owner deploys it again signed in as the account in Control B8 (README, "Live dashboard").'])));
    }
    if (S.area === 'live' && S.snap && S.refreshFailed) {
      add(root, h('div', { class: 'banner', role: 'alert' }, icon('info'),
        h('div', { class: 'banner-text' }, h('strong', {}, 'The last refresh did not work: '), `${S.refreshFailed.why}. `,
          `What you see is from ${since(S.snap.asOf) || 'earlier'}.`),
        h('button', { type: 'button', class: 'btn btn--sm', on: { click: () => loadSnapshot(true) } }, 'Try again')));
    }
  }

  /** The freshness line ("Updated 14 s ago · the bot ran 1 min ago"), updated every few seconds. Never throws. */
  function updateFresh() {
    const el = $('#fresh');
    const short = $('#fresh-short');
    if (!S.snap) { if (short) short.textContent = ''; return; }
    const asOf = numOr(S.snap.asOf);
    const run = numOr(obj(S.snap.health).lastRunAt);
    const updated = asOf ? `Updated ${since(asOf) || 'at a time the bot did not say'}` : 'The bot did not say when this was read';
    const ran = run ? `the bot ran ${since(run) || clock(run)}` : 'the bot\'s last run is not recorded';
    if (el) el.textContent = `${updated} · ${ran}`;
    if (short) short.textContent = `${updated}.`;
  }

  // -----------------------------------------------------------------------------------------------------------------
  // Live: the page
  // -----------------------------------------------------------------------------------------------------------------

  /** Draws the whole Live area from the snapshot (or the loading state, a refusal, a failure). Keeps focus where it was. Never throws. */
  function renderLive() {
    const root = $('#live-root');
    if (!root) return;
    const keep = rememberFocus();
    root.replaceChildren();
    if (!S.snap) {
      if (S.snapRefusal) { root.setAttribute('aria-busy', 'false'); add(root, refusalBlock(S.snapRefusal, () => { S.snapRefusal = null; renderLive(); loadSnapshot(true); }, 'the bot\'s work')); return; }
      if (S.snapErr) { root.setAttribute('aria-busy', 'false'); add(root, failBlock(S.snapErr, () => { S.snapErr = null; renderLive(); loadSnapshot(true); }, 'the bot\'s work')); return; }
      root.setAttribute('aria-busy', 'true');
      add(root, loadingBlock('Loading what the bot knows...'));
      return;
    }
    root.setAttribute('aria-busy', 'false');
    try {
      add(root, nowStrip(), firstSection(), thenSection(), questionsSection(), viewsPanel());
    } catch (e) {
      root.replaceChildren(failBlock(new Error(`the bot's answer could not be shown: ${errWords(e)}`), () => loadSnapshot(true), 'the bot\'s work'));
    }
    restoreFocus(keep);
    updateFresh();
    afterViewDrawn();
  }

  /** The loading state: a skeleton and the words. Pure but for the DOM. */
  function loadingBlock(words) {
    return h('div', {},
      h('div', { class: 'now panel glass', 'aria-live': 'polite' },
        h('p', { class: 'loading-word' }, h('span', { class: 'spinner', 'aria-hidden': 'true' }), h('span', {}, words)),
        h('div', { class: 'skel skel-head', 'aria-hidden': 'true' }),
        h('div', { class: 'skel skel-line', style: { width: '46%' }, 'aria-hidden': 'true' }),
        h('div', { class: 'skel skel-line', style: { width: '62%' }, 'aria-hidden': 'true' })),
      h('div', { class: 'section', 'aria-hidden': 'true' },
        h('div', { class: 'first-grid' }, h('div', { class: 'skel skel-card' }), h('div', { class: 'skel skel-card' }), h('div', { class: 'skel skel-card' }))));
  }

  /**
   * How old what the page shows is, by the bot's clock (ms since the snapshot was built), and whether it is too old to
   * show as it is: past STALE_MS, or the last refresh failed. {stale, age, why}. Never throws.
   */
  function staleness() {
    const asOf = numOr(S.snap && S.snap.asOf);
    const now = botNow();
    const age = asOf && now !== null ? Math.max(0, now - asOf) : null;
    const stale = !!S.refreshFailed || (age !== null && age > STALE_MS);
    const why = S.refreshFailed ? `the last refresh did not work (${txt(S.refreshFailed.why)})` : 'no newer answer has come from the bot';
    return { stale, age, why };
  }

  /** The Now strip: the level, the headline, how current the data is, the counts, what the page can't see, each source. Pure but for the DOM. */
  function nowStrip() {
    const now0 = obj(S.snap.now);
    const health = obj(S.snap.health);
    const old = staleness();
    S.drawnStale = old.stale;
    // what the page shows is old: "can't be sure", how old, and Refresh first (the cached calm headline is never shown then)
    const now = old.stale ? Object.assign({}, now0, { level: 'unknown',
      headline: `Can't be sure: what this page shows is from ${old.age !== null ? agoWords(old.age) : 'a time the bot did not say'}, and ${old.why}.`,
      first: [{ kind: 'health', id: 'page', title: 'Refresh this page', why: old.why,
        action: { text: 'Press Refresh. If it keeps failing, the owner of the bot checks that the web app is deployed (README, "Live dashboard").', view: 'refresh' } }] }) : now0;
    const level = levelOf(now.level);
    const serious = level === 'critical' || level === 'high' || level === 'unknown';
    const box = h('section', { class: `now panel glass${serious ? ' edge glow' : ''}`, id: 'now', 'aria-labelledby': 'now-headline' });
    add(box, h('div', { class: 'now-top' }, levelPill(level, 'now-level'), h('span', { class: 'fresh', id: 'fresh' })));
    add(box, h('h1', { class: 'now-headline', id: 'now-headline' }, txt(now.headline) || txt(health.headline) || 'The bot\'s answer has no headline.'));
    add(box, startBlock(now, level));

    const c = obj(now.counts);
    const countDefs = [['needAction', 'need a person', 'needs a person'], ['stuck', 'stuck', 'stuck'],
      ['alerts24h', 'alerts in the last 24 hours', 'alert in the last 24 hours'], ['forming', 'stories forming', 'story forming'],
      ['atBar', 'at the bar for a card', 'at the bar for a card']];
    const counts = countDefs.filter(([k]) => numOr(c[k]) !== null)
      .map(([k, many, one]) => h('div', { class: 'count-item' }, h('span', { class: 'count-num' }, fmt(c[k])), h('span', { class: 'count-label' }, numOr(c[k]) === 1 ? one : many)));
    if (counts.length) add(box, h('div', { class: 'counts' }, counts));
    const byLevel = LEVELS.filter(l => numOr(c[l]) !== null).map(l => `${fmt(c[l])} ${l}`);
    if (byLevel.length) add(box, h('p', { class: 'small muted', style: { 'margin-top': '6px' } }, `The last 24 hours by seriousness: ${byLevel.join(', ')}.`));
    // Control row 56 ON only (the answer has health.runLog then): when the bot ran, from its run log
    const runBox = runLogBlock(health.runLog);
    if (runBox) add(box, runBox);

    const cannot = arr(health.cannotSee);
    if (cannot.length) {
      // on a phone the chips fold behind one button (the strip's first screen keeps the first thing to do in sight)
      const chips = h('div', { class: `cansee${S.canSeeList ? ' open' : ''}`, id: 'cansee-chips' },
        h('button', { type: 'button', class: 'chip cansee-toggle', 'aria-expanded': String(S.canSeeList), 'aria-controls': 'cansee-chips', 'data-fk': 'cansee:list',
          on: { click: () => { S.canSeeList = !S.canSeeList; if (!S.canSeeList) S.canSeeOpen = -1; redrawNow(); } } },
        icon('info', 'icon-inline'), `What this page can't see (${cannot.length})`, icon('chevron', 'icon-inline')),
        h('span', { class: 'cansee-label', id: 'cansee-label' }, 'What this page can\'t see:'));
      cannot.forEach((x, i) => {
        add(chips, h('button', { type: 'button', class: 'chip', 'aria-expanded': String(S.canSeeOpen === i), 'aria-controls': 'cansee-explain',
          'data-fk': `cansee:${i}`, on: { click: () => { S.canSeeOpen = S.canSeeOpen === i ? -1 : i; redrawNow(); } } }, icon('info', 'icon-inline'), txt(x.what) || 'Something not named'));
      });
      add(box, chips);
      const open = cannot[S.canSeeOpen];
      add(box, h('div', { class: 'explain', id: 'cansee-explain', hidden: !open, 'aria-live': 'polite' },
        open ? [h('p', {}, h('b', {}, `${txt(open.what)}: `), txt(open.why) || 'The bot did not say why.'),
          txt(open.fix) ? h('p', { class: 'muted' }, h('b', {}, 'What to do: '), txt(open.fix)) : null] : null));
    }

    const sources = arr(health.sources);
    const status = txt(health.status);
    const srcBtn = h('button', { type: 'button', class: 'btn btn--text btn--sm disclosure', 'aria-expanded': String(S.sourcesOpen), 'aria-controls': 'sources-list',
      'data-fk': 'sources', id: 'sources-toggle', on: { click: () => { S.sourcesOpen = !S.sourcesOpen; redrawNow(); } } },
    `How current each source is (${sources.length})`, icon('chevron'));
    const list = h('ul', { class: 'sources-list', id: 'sources-list', hidden: !S.sourcesOpen });
    sources.forEach(s => {
      const st = SOURCE_STATE[s.state] || { label: txt(s.state) || 'Not known', tone: 'st-plain' };
      add(list, h('li', { class: 'source-row' }, h('span', { class: `pill ${st.tone}` }, st.label),
        h('div', { class: 'wrap-any' }, h('div', {}, txt(s.label) || txt(s.key)), txt(s.note) ? h('div', { class: 'small muted' }, txt(s.note)) : null),
        h('span', { class: 'when' }, s.at ? timeEl(s.at) : (s.state === 'off' ? 'off' : 'no record'))));
    });
    if (!sources.length) add(list, h('li', { class: 'small muted' }, 'The bot\'s answer lists no sources.'));
    const health2 = [];
    if (txt(health.fix) && obj(S.snap.health).level !== 'ok') health2.push(h('p', { class: 'small', style: { 'margin-top': '8px' } }, h('b', {}, 'What to do: '), txt(health.fix)));
    if (status) health2.push(h('p', { class: 'small muted', style: { 'margin-top': '8px' } }, `Status on the Control tab (B5): ${status}`));
    add(box, h('div', { class: 'sources' }, srcBtn, list, health2));
    return box;
  }

  /**
   * When the bot ran, in the Now strip (Control row 56 ON: health.runLog): the newest stretch of the last 7 days in which
   * it was not running, paused, failing or not known, in the bot's own words, with how many there were; every stretch and
   * the notes (running the whole time, where its run log starts, no run lately) fold behind one button, as "How current
   * each source is" does, so a bad week's list never pushes the first thing to do out of the first screen. With no
   * stretch, the notes show as they are. Null when the answer has no run log (row 56 OFF). Pure but for the DOM.
   */
  function runLogBlock(v) {
    if (!v || typeof v !== 'object' || Array.isArray(v)) return null;
    const r = obj(v);
    const cap = s => (s ? s.charAt(0).toUpperCase() + s.slice(1) : s);
    const spans = arr(r.spans).map(obj).map(s => cap(txt(s.words))).filter(Boolean);

    const total = spans.length + Math.max(0, numOr(r.more) || 0);
    const lead = spans.length ? ` ${spans[0]}${total > 1 ? ` (the latest of ${fmt(total)} such stretches in the last 7 days)` : ''}.` : '';
    const head = h('p', {}, h('b', {}, 'When the bot ran (last 7 days, from its run log):'), lead || null);
    if (!spans.length) return h('div', { class: 'runlog small', id: 'runlog', style: { 'margin-top': '8px' } }, head, notes.map(n => h('p', { class: 'muted' }, n)));
    const btn = h('button', { type: 'button', class: 'btn btn--text btn--sm disclosure', 'aria-expanded': String(!!S.runLogOpen), 'aria-controls': 'runlog-list',
      'data-fk': 'runlog', id: 'runlog-toggle', on: { click: () => { S.runLogOpen = !S.runLogOpen; redrawNow(); } } },
    `Every stretch, and where the run log starts (${fmt(spans.length)}${total > spans.length ? ' shown' : ''})`, icon('chevron'));
    const list = h('div', { id: 'runlog-list', hidden: !S.runLogOpen },
      h('ul', { class: 'plain-list' }, spans.map(s => h('li', {}, `${s}.`))), notes.map(n => h('p', { class: 'muted' }, n)));
    return h('div', { class: 'runlog small', id: 'runlog', style: { 'margin-top': '8px' } }, head, btn, list);
  }

  /**
   * The first thing to do, in the Now strip: the first "Look here first" item's next step and its button. Shown where
   * the cards stack (a phone, a narrow window), so the first screen answers what to do; a wide screen has the cards

  function startBlock(now, level) {
    const it = obj(arr(now.first)[0]);

        on: { click: ev => runAction(a, ev.currentTarget) } }, actionWords(a), icon('arrow'))));

  /** Draws the Now strip again in place (a chip or the sources list opened). Never throws. */
  function redrawNow() {
    const old = $('#now');
    if (!old || !S.snap) return;
    const keep = rememberFocus();
    old.replaceWith(nowStrip());
    restoreFocus(keep);
    updateFresh();
  }

  /** The button words for an item's primary action: open its detail, or go to the view that shows it. Pure. */
  function actionWords(action) {
    if (obj(action).view === 'refresh') return 'Refresh';
    const a = obj(action);
    const d = obj(a.detail);
    if (d.kind && d.id) return d.kind === 'cluster' ? 'Open the story' : 'Open the alert';
    return VIEW_GO_WORDS[a.view] || 'Show it';
  }

  /** Runs an item's primary action. Never throws. */
  function runAction(action, opener) {
    if (obj(action).view === 'refresh') { loadSnapshot(true); return; }
    const a = obj(action);
    const d = obj(a.detail);
    if (d.kind && d.id) openDetail(d.kind, d.id, false, opener);
    else goView(a.view, a.filter);
  }

  /** Goes to what a view key names (a view tab, with its filter; the sources; the look-first list; the why-not form). Never throws. */
  function goView(view, filter) {
    if (view === 'health') {
      S.sourcesOpen = true;
      redrawNow();
      scrollToEl($('#now'));
      const t = $('#sources-toggle');
      if (t) t.focus({ preventScroll: true });
      return;
    }
    if (view === 'now') { scrollToEl($('#first')); return; }
    if (view === 'whynot') { openWhyNot(); return; }
    if (!VIEWS.some(v => v.key === view)) return;
    setView(view, filter === undefined ? '' : filter);
    scrollToEl($('#views'));
  }

  /** The "Look here first" section: 1-3 cards, each with why, level and a primary action. Pure but for the DOM. */
  function firstSection() {

      h('div', { class: 'section-head' }, h('h2', { class: 'section-title', id: 'first-title' }, 'Look here first'),

    if (!items.length) {
      add(sec, h('div', { class: 'empty' }, h('h3', {}, 'Nothing to look at first'),
        h('p', {}, 'The bot\'s answer lists nothing that needs a person, no story forming and no alert in the last 24 hours. The headline above says how current that is.')));
      return sec;
    }
    add(sec, h('div', { class: 'first-grid' }, items.map((it, i) => itemCard(it, i))));

  /** One "Look here first" card. Pure but for the DOM. */
  function itemCard(it, i) {
    const x = obj(it);
    const a = obj(x.action);
    const titleId = `first-${i}`;
    const lead = i === 0;

  /** The views panel: the tabs and the picked view. Pure but for the DOM. */

  /** One view's content. Pure but for the DOM. */
  function renderView(key) {
    if (key === 'alerts') return alertsView();
    if (key === 'pressure') return pressureView();
    if (key === 'pipeline') return pipelineView();
    if (key === 'early') return earlyView();
    if (key === 'held') return heldView();

  }

  /** Shows view `key` (with a filter from an item or a question: 'status:<key>', 'id:<story>', 'stuck', 'corrected'). Never throws. */
  function setView(key, filter) {
    S.view = VIEWS.some(v => v.key === key) ? key : 'map';
    lsSet('view', S.view);
    if (filter !== undefined) applyFilter(S.view, filter);
    const old = $('#views');
    if (!old || !S.snap) return;
    const keep = rememberFocus();
    old.replaceWith(viewsPanel());
    restoreFocus(keep);
    afterViewDrawn();

  /** Applies a filter string to a view's controls. Never throws. */
  function applyFilter(view, filter) {
    const f = txt(filter);
    if (view === 'alerts') {
      S.alerts = { q: '', status: '', level: '', kind: '', flow: '', sort: S.alerts.sort || 'newest', corrected: false };
      if (f.indexOf('status:') === 0) S.alerts.status = f.slice(7);
      else if (f === 'corrected') S.alerts.corrected = true;
    } else if (view === 'map') {
      S.map.focus = f.indexOf('id:') === 0 ? f.slice(3) : '';
      if (S.map.focus) S.map.filter = 'all';
    } else if (view === 'pipeline') {
      S.pipelineFlash = f === 'stuck';
    }
  }

  /** Work that needs the view on the page (its size): the map's drawing, a flash on the stuck list. Never throws. */
  function afterViewDrawn() {
    if (!S.snap) return;
    // the picked tab is kept in sight inside its strip (a phone shows only a few tabs at a time)
    const tab = document.getElementById(`tab-${S.view}`);
    const strip = tab && tab.parentNode;
    if (strip && strip.scrollWidth > strip.clientWidth) {
      const tr = tab.getBoundingClientRect();
      const sr = strip.getBoundingClientRect();
      strip.scrollLeft += (tr.left - sr.left) - (sr.width - tr.width) / 2;
    }
    if (S.view === 'map') {
      const box = $('#map-box');
      if (box) {
        drawMap(box);
        watchMapSize(box);
      }
    }
    if (S.view === 'pipeline' && S.pipelineFlash) {
      const st = $('#stuck');
      if (st) { st.classList.add('flash'); scrollToEl(st); }
      S.pipelineFlash = false;
    }

  // ---------- Story map ----------

  /** A story's size value for the map's size switch (accounts, posts, engagement); null when not kept. Pure. */
  function sizeVal(c, key) {
    if (key === 'posts') return numOr(c.posts);

  /** The platforms of the stories, each with its colour (one platform: its own; several: one colour for all). Pure. */
  function platformColors(list) {
    const names = Array.from(new Set(list.filter(c => arr(c.platforms).length === 1).map(c => txt(c.platforms[0])))).sort();
    const map = {};
    names.forEach((n, i) => { map[n] = i < 6 ? `var(--chart-${i + 1})` : 'var(--chart-neutral)'; });
    return map;
  }

  /** A story's colour for the map's colour switch (seriousness, speed, platform). Pure. */
  function nodeColor(c, pcolors) {
    if (S.map.color === 'speed') return `var(--sp-${SPEEDS.indexOf(c.speed) >= 0 ? c.speed : 'unknown'})`;
    if (S.map.color === 'platform') {
      const p = arr(c.platforms);
      if (p.length === 1) return pcolors[txt(p[0])] || 'var(--chart-neutral)';
      return p.length ? 'var(--outline)' : 'var(--outline-variant)';

  /** A labelled segmented switch (aria-pressed buttons). Pure but for the DOM. */

  /** The map's legend for the current colour switch, plus the ring, the numbers and the size notes. Pure but for the DOM. */
  function mapLegend(shown) {
    const items = [];
    if (S.map.color === 'speed') {
      SPEEDS.forEach(sp => items.push([`var(--sp-${sp})`, SPEED_WORDS[sp]]));

      h('span', { class: 'legend-item' }, h('span', { class: 'legend-ring', 'aria-hidden': 'true' }), reduceMotion.matches ? 'Ring: speed (thicker is faster)' : 'Ring: speed (pulses faster when faster)'),

  /** The keyboard and screen-reader friendly list of the stories (the map's twin). Pure but for the DOM. */

      add(list, h('li', {}, h('button', { type: 'button', class: `story-row${String(c.id) === S.map.focus ? ' focus' : ''}`, id: `story-${cssId(c.id)}`,
        'aria-label': aria, 'data-fk': `story:${c.id}`, on: { click: ev => openDetail('cluster', String(c.id), false, ev.currentTarget) } },
      h('span', { class: 'story-dot', style: { background: nodeColor(c, pc) }, 'aria-hidden': 'true' }),
      h('span', {}, h('span', { class: 'story-title' }, c.mark ? h('span', { class: 'rank', style: { 'margin-right': '8px', display: 'inline-grid' } }, String(c.mark)) : null, label),
        h('span', { class: 'story-meta' }, levelPill(c.level), meta.join(' · '))))));

  /** An id made safe for an element id. Pure. */
  function cssId(id) {
    return String(id).replace(/[^A-Za-z0-9_-]/g, '_');
  }

  /** Redraws the map when its box changes width (a phone turned, a window resized). Never throws. */
  function watchMapSize(box) {
    try {
      if (mapObserver) mapObserver.disconnect();
      if (!window.ResizeObserver) return;
      let last = box.clientWidth;
      mapObserver = new ResizeObserver(() => {
        const w = box.clientWidth;
        if (Math.abs(w - last) < 24) return;
        last = w;
        clearTimeout(watchMapSize.t);
        watchMapSize.t = setTimeout(() => { if (document.body.contains(box)) drawMap(box); }, 150);
      });
      mapObserver.observe(box);
    } catch (e) { /* drawn once */ }
  }

  /**
   * Draws the bubble map into `box` with d3 (v7): stories packed inside their topic's circle, area by the size switch,
   * fill by the colour switch, a ring whose pulse (or thickness, with reduced motion) shows speed, and the top three
   * numbered with a gradient glow. Hover shows a card; a click opens the story. Without d3 it says so (the list has
   * every story). Never throws.
   */
  function drawMap(box) {
    try {
      box.replaceChildren();
      const items = mapStories();
      if (!items.length) {
        add(box, h('p', { class: 'muted', style: { padding: '24px' } }, 'No story matches this filter.'));
        return;
      }
      const d3 = window.d3;
      if (!d3 || !d3.pack || !d3.hierarchy) {
        add(box, h('p', { class: 'muted', style: { padding: '24px' } }, 'The map could not be drawn: its drawing library (d3) did not load. Every story is in the list.'));
        return;
      }
      const W = Math.max(280, Math.round(box.clientWidth || 600));
      const H = Math.round(Math.min(680, Math.max(300, W < 600 ? W * 1.08 : W * 0.82)));
      const TOP = 22;  // room above the topic circles for their names
      const key = S.map.size;
      const max = Math.max(1, ...items.map(c => sizeVal(c, key) || 0));
      const floor = max / 30;
      const groups = new Map();
      items.forEach(c => {
        const t = txt(c.topic) || 'No topic named';
        if (!groups.has(t)) groups.set(t, []);
        groups.get(t).push(c);
      });
      const root = d3.hierarchy({ children: Array.from(groups.entries()).map(([topic, list]) => ({ topic, children: list.map(c => ({ c })) })) })
        .sum(d => (d.c ? Math.max(floor, sizeVal(d.c, key) || 0) : 0))
        .sort((a, b) => b.value - a.value);
      d3.pack().size([W - 8, H - TOP - 4]).padding(d => (d.depth === 0 ? 22 : 5))(root);
      const pcolors = platformColors(arr(S.snap.clusters).map(obj));
      const svg = sv('svg', { viewBox: `0 0 ${W} ${H}`, width: W, height: H, role: 'img',
        'aria-label': `Story map: ${items.length} ${items.length === 1 ? 'story' : 'stories'} in ${groups.size} ${groups.size === 1 ? 'topic' : 'topics'}. Every story is also in the list.` });
      add(svg, sv('defs', {},
        sv('linearGradient', { id: 'dashRingGrad', x1: '0', y1: '0', x2: '1', y2: '1' },
          sv('stop', { offset: '0%', 'stop-color': '#3186ff' }), sv('stop', { offset: '55%', 'stop-color': '#ac87eb' }), sv('stop', { offset: '100%', 'stop-color': '#ee4d5d' })),
        sv('filter', { id: 'dashGlowBlur', x: '-50%', y: '-50%', width: '200%', height: '200%' }, sv('feGaussianBlur', { stdDeviation: '3.5' }))));
      const plot = sv('g', { transform: `translate(4,${TOP})` });
      const topics = sv('g', { 'aria-hidden': 'true' });
      (root.children || []).forEach(t => {
        add(topics, sv('circle', { class: 'map-topic', cx: t.x.toFixed(1), cy: t.y.toFixed(1), r: t.r.toFixed(1) }));
      });
      add(plot, topics);
      const nodes = sv('g', { 'aria-hidden': 'true' });
      const tip = h('div', { class: 'map-tip', hidden: true, role: 'presentation' });
      root.leaves().forEach(leaf => {
        const c = leaf.data.c;
        if (!c) return;
        const r = leaf.r;
        const dim = S.map.focus && String(c.id) !== S.map.focus;
        const dashed = key === 'engagement' && numOr(c.engagement) === null;
        const g = sv('g', { class: `map-node${dim ? ' dim' : ''}${String(c.id) === S.map.focus ? ' focus' : ''}${dashed ? ' dashed' : ''}`,
          transform: `translate(${leaf.x.toFixed(1)},${leaf.y.toFixed(1)})` });
        if (c.mark) {
          add(g, sv('circle', { class: 'map-mark-glow', r: (r + 5).toFixed(1) }));
          add(g, sv('circle', { class: 'map-mark-ring', r: (r + 3).toFixed(1) }));
        }
        const sp = SPEEDS.indexOf(c.speed) >= 0 ? c.speed : 'unknown';
        add(g, sv('circle', { class: `map-ring spd-${sp}`, r: (r + 1.5).toFixed(1), style: { stroke: `var(--sp-${sp})` } }));
        add(g, sv('circle', { class: 'body', r: r.toFixed(1), style: { fill: nodeColor(c, pcolors), 'fill-opacity': '0.92' } }));
        if (r >= 24) {
          const label = txt(c.label) || txt(c.topic) || '';
          const fit = Math.max(4, Math.floor((r * 1.7) / 6.4));
          add(g, sv('text', { class: 'map-label', 'text-anchor': 'middle', dy: '0.35em' }, label.length > fit ? `${label.slice(0, fit - 1).trim()}…` : label));
        }
        if (c.mark) {
          const bx = r * 0.72;
          add(g, sv('g', { class: 'map-badge', transform: `translate(${bx.toFixed(1)},${(-bx).toFixed(1)})` },
            sv('circle', { r: '10' }), sv('text', { 'text-anchor': 'middle', dy: '0.36em' }, String(c.mark))));
        }
        const show = ev => {
          tip.replaceChildren(h('b', {}, txt(c.label) || txt(c.topic) || String(c.id)),
            h('div', {}, `${pl(c.accounts, 'account', 'accounts')} · ${pl(c.posts, 'post', 'posts')} · engagement ${fmt(c.engagement)}`),
            h('div', {}, `${LEVEL_WORDS[levelOf(c.level)]} · ${SPEED_WORDS[sp]} · ${(CLUSTER_STATUS[c.status] || {}).label || txt(c.status)}`),
            arr(c.platforms).length ? h('div', { class: 'muted' }, arr(c.platforms).join(', ')) : null,
            h('div', { class: 'muted' }, 'Click to open the story'));
          tip.hidden = false;
          const rect = box.getBoundingClientRect();
          const x = ev.clientX - rect.left;
          const y = ev.clientY - rect.top;
          const tw = Math.min(280, rect.width - 16);
          tip.style.left = `${Math.max(8, Math.min(x + 14, rect.width - tw - 8))}px`;
          tip.style.top = `${Math.max(8, Math.min(y + 14, rect.height - 120))}px`;
        };
        g.addEventListener('mouseenter', show);
        g.addEventListener('mousemove', show);
        g.addEventListener('mouseleave', () => { tip.hidden = true; });
        g.addEventListener('click', () => {
          tip.hidden = true;
          const row = document.getElementById(`story-${cssId(c.id)}`);
          openDetail('cluster', String(c.id), false, row || null);
        });
        add(nodes, g);
      });
      add(plot, nodes);
      // topic names on top of everything, just above each topic's circle (never over a story)
      const labels = sv('g', { 'aria-hidden': 'true' });
      (root.children || []).forEach(t => {
        const name = txt(t.data.topic);
        const fit = Math.max(8, Math.floor((Math.max(t.r, 40) * 2.4) / 6.6));
        add(labels, sv('text', { class: 'map-topic-label', x: t.x.toFixed(1), y: (t.y - t.r - 6).toFixed(1), 'text-anchor': 'middle' },
          name.length > fit ? `${name.slice(0, fit - 1).trim()}…` : name));
      });
      add(plot, labels);
      add(svg, plot);
      add(box, svg, tip);
      if (S.map.focus) {
        const row = document.getElementById(`story-${cssId(S.map.focus)}`);
        if (row && row.parentNode && row.closest('.story-list')) {
          const list = row.closest('.story-list');
          list.scrollTop = Math.max(0, row.parentNode.offsetTop - 40);
        }
      }
    } catch (e) {
      box.replaceChildren(h('p', { class: 'muted', style: { padding: '24px' } }, `The map could not be drawn (${errWords(e)}). Every story is in the list.`));
    }
  }

  // ---------- Alerts ----------

  /** The alerts the filters and the search let through, in the picked order. Pure. */
  function filteredAlerts() {
    const f = S.alerts;
    const q = txt(f.q).toLowerCase();
    const list = arr(S.snap.alerts).map(obj).filter(a => {
      if (f.status && obj(a.status).key !== f.status) return false;
      if (f.level && levelOf(a.level) !== f.level) return false;
      if (f.kind && a.kind !== f.kind) return false;
      if (f.flow && a.flow !== f.flow) return false;
      if (f.corrected && !(numOr(a.corrections) > 0)) return false;
      if (q) {
        const hay = [a.id, a.issue, a.product, a.platform, a.author, a.tag, a.decision, obj(a.status).label, obj(a.owner).who, KIND_WORDS[a.kind], a.flow]
          .concat(arr(a.topics)).map(txt).join(' ').toLowerCase();
        if (hay.indexOf(q) < 0) return false;
      }
      return true;
    });
    const at = a => numOr(a.createdAt) || 0;
    const by = {
      newest: (x, y) => at(y) - at(x),
      oldest: (x, y) => at(x) - at(y),
      serious: (x, y) => LEVEL_RANK[levelOf(y.level)] - LEVEL_RANK[levelOf(x.level)] || at(y) - at(x),
      engagement: (x, y) => (numOr(y.engagement) === null ? -1 : numOr(y.engagement)) - (numOr(x.engagement) === null ? -1 : numOr(x.engagement)) || at(y) - at(x),
      issue: (x, y) => txt(x.issue).localeCompare(txt(y.issue)) || at(y) - at(x),
    };
    return list.sort(by[f.sort] || by.newest);
  }

  /** The Alerts view: search, filters, sort, and the list (a table on a laptop, cards on a phone). Pure but for the DOM. */
  function alertsView() {
    const all = arr(S.snap.alerts).map(obj);
    const wrap = h('div');
    const total = numOr(S.snap.alertsTotal);
    add(wrap, lead(`the alerts of the last 7 days (${all.length}${total !== null && total > all.length ? ` of ${fmt(total)}` : ''}). ` +
      'Status, who has it and the next step are worked out from what each alert\'s row keeps. Pick one to see everything about it.'));
    if (!all.length) {
      const cs = cannotSeeAbout(/^alerts/i);
      add(wrap, emptyState('No alerts in the last 7 days',
        cs ? `${txt(cs.what)}: ${txt(cs.why)}` : 'The Alert log has no alert recorded in the last 7 days.',
        cs && txt(cs.fix) ? txt(cs.fix) : 'Alerts appear here as soon as the bot records them. Press Refresh to look again.', refreshButton()));
      return wrap;
    }
    const opts = (vals, words) => [h('option', { value: '' }, 'All')].concat(vals.map(v => h('option', { value: v }, words(v))));
    const uniq = pick => Array.from(new Set(all.map(pick).filter(Boolean)));
    const statusLabels = {};
    all.forEach(a => { const s = obj(a.status); if (s.key) statusLabels[s.key] = txt(s.label) || s.key; });
    const select = (label, key, values, words) => h('label', { class: 'field' }, h('span', {}, label),
      h('select', { class: 'select', 'data-fk': `af:${key}`, on: { change: ev => { S.alerts[key] = ev.target.value; redrawAlertResults(); } } },
        opts(values, words).map(o => { if (o.value === S.alerts[key]) o.selected = true; return o; })));
    const tb = h('div', { class: 'toolbar' });
    add(tb, h('div', { class: 'search', role: 'search' }, icon('search'),
      h('input', { type: 'search', class: 'input', 'aria-label': 'Search the alerts', placeholder: 'Search issue, product, author, id', value: S.alerts.q,
        'data-fk': 'af:q', on: { input: ev => { S.alerts.q = ev.target.value; redrawAlertResults(); } } })));
    add(tb, select('Status', 'status', Object.keys(statusLabels), v => statusLabels[v]));
    add(tb, select('Seriousness', 'level', LEVELS.filter(l => all.some(a => levelOf(a.level) === l)), l => LEVEL_WORDS[l]));
    add(tb, select('Kind', 'kind', uniq(a => a.kind), k => KIND_WORDS[k] || k));
    const flows = uniq(a => a.flow);
    if (flows.length) add(tb, select('Flow', 'flow', flows, f => f.charAt(0).toUpperCase() + f.slice(1)));
    add(tb, h('label', { class: 'field' }, h('span', {}, 'Sort'),
      h('select', { class: 'select', 'data-fk': 'af:sort', on: { change: ev => { S.alerts.sort = ev.target.value; redrawAlertResults(); } } },
        [['newest', 'Newest first'], ['oldest', 'Oldest first'], ['serious', 'Most serious first'], ['engagement', 'Most engagement first'], ['issue', 'Issue, A to Z']]
          .map(([v, w]) => h('option', { value: v, selected: S.alerts.sort === v }, w)))));
    add(tb, h('button', { type: 'button', class: 'chip', 'aria-pressed': String(!!S.alerts.corrected), 'data-fk': 'af:corrected',
      on: { click: () => { S.alerts.corrected = !S.alerts.corrected; setView('alerts'); } } }, 'Corrected by the bot'));
    add(wrap, tb);
    add(wrap, h('div', { id: 'alert-results' }, alertResults()));
    return wrap;
  }

  /** Draws the alert results again (after a search or a filter change), keeping the controls. Never throws. */
  function redrawAlertResults() {
    const box = $('#alert-results');
    if (!box) return;
    box.replaceChildren(alertResults());
  }

  /** True when any alert filter or the search is set. Pure. */
  function alertFiltersOn() {
    const f = S.alerts;
    return !!(f.q || f.status || f.level || f.kind || f.flow || f.corrected);
  }

  /** The alert results: the table, the phone cards, and the count line. Pure but for the DOM. */
  function alertResults() {
    const all = arr(S.snap.alerts);
    const list = filteredAlerts();
    const out = h('div');
    if (alertFiltersOn()) {
      add(out, h('div', { class: 'filter-note', role: 'status' }, `${pl(list.length, 'alert matches', 'alerts match')} the search and filters.`,
        h('button', { type: 'button', class: 'btn btn--sm btn--text', on: { click: () => { applyFilter('alerts', ''); setView('alerts'); } } }, 'Clear the search and filters')));
    }
    if (!list.length) {
      add(out, emptyState('No alert matches', `None of the ${all.length} alerts matches the search and filters.`, 'Clear the search and filters, or change them.',
        h('button', { type: 'button', class: 'btn btn--tonal', on: { click: () => { applyFilter('alerts', ''); setView('alerts'); } } }, 'Clear the search and filters')));
      return out;
    }
    const table = h('table', { class: 'table table-alerts' },
      h('caption', { class: 'sr-only' }, 'Alerts of the last 7 days'),
      h('thead', {}, h('tr', {}, ['Seriousness', 'Status', 'Issue', 'Product', 'Platform', 'Kind', 'When'].map(t => h('th', { scope: 'col' }, t)))));
    const body = h('tbody');
    const cards = h('ul', { class: 'alert-cards', 'aria-label': 'Alerts' });
    list.forEach(a => {
      const issue = txt(a.issue) || txt(a.id) || 'No issue name';
      const subParts = [txt(a.author), txt(a.id)].filter(Boolean);
      const corrected = numOr(a.corrections) > 0 ? h('span', { class: 'pill st-info', style: { 'margin-left': '6px' } }, `${a.corrections} corrected`) : null;
      const open = ev => openDetail('alert', String(a.id), false, ev.currentTarget);
      add(body, h('tr', {},
        h('td', {}, levelPill(a.level)),
        h('td', {}, statusPill(a.status)),
        h('td', {}, h('button', { type: 'button', class: 'row-open', 'data-fk': `alert:${a.id}`, on: { click: open } }, issue), corrected,
          subParts.length ? h('span', { class: 'sub' }, subParts.join(' · ')) : null,
          obj(a.owner).who ? h('span', { class: 'sub' }, `With: ${txt(a.owner.who)}`) : null),
        h('td', {}, txt(a.product) || h('span', { class: 'muted' }, 'none')),
        h('td', {}, txt(a.platform) || h('span', { class: 'muted' }, 'none')),
        h('td', {}, KIND_WORDS[a.kind] || txt(a.kind), a.flow ? h('span', { class: 'sub' }, `${a.flow} flow`) : null),
        h('td', { class: 'nowrap' }, timeEl(a.createdAt))));
      add(cards, h('li', { class: 'alert-card' },
        h('div', { class: 'item-head' }, levelPill(a.level), statusPill(a.status), corrected),
        h('button', { type: 'button', class: 'row-open', 'data-fk': `alertc:${a.id}`, on: { click: open } }, issue),
        h('div', { class: 'meta' }, [txt(a.product), txt(a.platform), KIND_WORDS[a.kind] || txt(a.kind)].filter(Boolean).join(' · '), ' · ', timeEl(a.createdAt)),
        obj(a.owner).who ? h('div', { class: 'small muted' }, `With: ${txt(a.owner.who)}`) : null));
    });
    add(table, body);
    add(out, h('div', { class: 'table-wrap table-alerts' }, table), cards);
    const total = numOr(S.snap.alertsTotal);
    let foot = `Showing ${list.length} of the ${all.length} alerts in this answer.`;
    if (total !== null && total > all.length) foot += ` The last 7 days hold ${fmt(total)}: this page got the newest ${all.length} (the answer is kept small).`;
    add(out, h('p', { class: 'list-foot' }, foot));
    return out;
  }

  // ---------- Pressure ----------

  /** A change cell: +3 / -2 / 0, or "not counted" when the rows read do not reach back that far. Pure but for the DOM. */
  function changeCell(v) {
    const n = numOr(v);
    if (n === null) return h('span', { class: 'muted', title: 'The rows read do not reach back that far, so it is not counted' }, 'not counted');
    if (n > 0) return h('span', { class: 'change-up' }, `+${fmt(n)}`);
    if (n < 0) return h('span', { class: 'change-down' }, `−${fmt(-n)}`);
    return h('span', { class: 'muted' }, '0');
  }

  /** One pressure table (by issue, product or platform). Pure but for the DOM. */
  function pressureTable(title, rows) {
    const list = arr(rows).map(obj);
    const card = h('div', { class: 'card' }, h('h3', {}, title));
    if (!list.length) {
      add(card, h('p', { class: 'muted' }, 'No alerts named one in these windows.'));
      return card;
    }
    const max = Math.max(1, ...list.map(r => numOr(r.now24) || 0));
    const cols = [['Name', ''], ['Last 24 h', 'num'], ['24 h before', 'num'], ['Change', 'num'], ['Last 7 days', 'num'], ['7 days before', 'num'], ['Change', 'num']];
    add(card, h('div', { class: 'table-wrap', style: { 'margin-top': '0' } }, h('table', { class: 'table table-stack' },
      h('thead', {}, h('tr', {}, cols.map(([c, cls]) => h('th', { scope: 'col', class: cls }, c)))),
      h('tbody', {}, list.map(r => h('tr', {},
        h('td', {}, h('span', { class: 'bar', style: { width: `${Math.round(((numOr(r.now24) || 0) / max) * 40)}px` }, 'aria-hidden': 'true' }), txt(r.name)),
        h('td', { class: 'num', 'data-label': 'Last 24 h' }, fmt(r.now24, 'not counted')),
        h('td', { class: 'num', 'data-label': '24 h before' }, fmt(r.prev24, 'not counted')),
        h('td', { class: 'num', 'data-label': 'Change' }, changeCell(r.change24)),
        h('td', { class: 'num', 'data-label': 'Last 7 days' }, fmt(r.now7, 'not counted')),
        h('td', { class: 'num', 'data-label': '7 days before' }, fmt(r.prev7, 'not counted')),
        h('td', { class: 'num', 'data-label': 'Change, 7 days' }, changeCell(r.change7))))))));
    return card;
  }

  /** The Pressure view: alert counts by issue, product and platform (24 h and 7 days, each against the one before), the speed leaders, the bot's load. Pure but for the DOM. */
  function pressureView() {
    const p = obj(S.snap.pressure);
    const wrap = h('div');
    add(wrap, lead(`where alerts are rising: counts of ${txt(p.unit) || 'alerts'}, the last 24 hours against the 24 before, and 7 days against the 7 before. Biggest rises first.`));
    if (!Object.keys(p).length) {
      add(wrap, emptyState('Nothing to show', 'The bot\'s answer has no pressure figures.', 'Press Refresh to ask again.', refreshButton()));
      return wrap;
    }
    if (txt(p.note)) add(wrap, h('div', { class: 'filter-note', role: 'note' }, txt(p.note)));
    add(wrap, h('div', { style: { display: 'grid', gap: '16px', 'margin-top': '16px' } },
      pressureTable('By issue', p.byIssue), pressureTable('By product', p.byProduct), pressureTable('By platform', p.byPlatform)));
    const leaders = arr(p.speedLeaders).map(obj);
    const lcard = h('div', { class: 'card' }, h('h3', {}, 'Stories growing fastest'));
    if (obj(S.snap.switches).earlyWave !== true) add(lcard, h('p', { class: 'muted' }, 'Stories are not followed (Early Detection, row 19, is OFF), so none is shown here.'));
    else if (!leaders.length) add(lcard, h('p', { class: 'muted' }, 'No story is rising or surging right now.'));
    else {
      add(lcard, h('ul', { class: 'plain-list' }, leaders.map(c => h('li', {},
        h('button', { type: 'button', class: 'row-open', 'data-fk': `lead:${c.id}`, on: { click: ev => openDetail('cluster', String(c.id), false, ev.currentTarget) } }, txt(c.label) || String(c.id)),
        h('div', { class: 'story-meta' }, levelPill(c.level), h('span', { class: 'pill st-warn' }, SPEED_WORDS[c.speed] || txt(c.speed)),
          txt(c.why) ? h('span', {}, txt(c.why)) : null)))));
    }
    const load = obj(p.load);
    const ldcard = h('div', { class: 'card' }, h('h3', {}, 'How hard the bot is working'));
    if (load.measured === true) {
      const rows = [];
      if (numOr(load.runSec) !== null) rows.push(['Run time', `${fmt(load.runSec)} s of a ${fmt(load.budgetSec, 'not set')} s budget${numOr(load.share) !== null ? ` (${Math.round(load.share * 100)}%)` : ''}`]);
      if (numOr(load.calls) !== null) rows.push(['Outside calls', `${fmt(load.calls)} of ${fmt(load.callBudget, 'no set number')}`]);
      // Control row 56 ON (load.pickupNote): the pick-up time leaving out the alerts posted before the bot came back,
      // under the usual one (which is as it was)
      const pickNote = txt(load.pickupNote) ? h('span', { class: 'sub pickup-note' }, txt(load.pickupNote)) : null;
      if (numOr(load.pickupP90Sec) !== null) rows.push(['Pick-up time', [`90% within ${fmt(load.pickupP90Sec)} s (${pl(load.pickupRuns, 'run', 'runs')})`, pickNote]]);
      else if (pickNote) rows.push(['Pick-up time', ['none counted today', pickNote]]);
      const today = obj(load.today);
      if (numOr(today.reviews) !== null || numOr(today.quickLooks) !== null) rows.push(['Today', `${pl(today.reviews, 'review', 'reviews')}, ${pl(today.quickLooks, 'quick look', 'quick looks')}`]);
      const stop = obj(today.stop);
      rows.push(['Safety stop today', stop.what ? `${txt(stop.what)}${stop.at ? ` at ${clock(stop.at)}` : ''}` : 'none']);
      add(ldcard, h('dl', { class: 'kv' }, rows.map(([k, v]) => [h('dt', {}, k), h('dd', {}, v)])));
    } else {
      add(ldcard, h('p', { class: 'muted' }, txt(load.why) || 'Not measured.'));
    }
    add(wrap, h('div', { class: 'grid-2' }, lcard, ldcard));
    return wrap;
  }

  // ---------- Pipeline ----------

  /** The Pipeline view: the stages of the last 7 days with their counts, and what is stuck (each with why and action). Pure but for the DOM. */
  function pipelineView() {
    const p = obj(S.snap.pipeline);

    if (!stuck.length) add(sec, h('p', { class: 'muted' }, 'Nothing is stuck.'));

            on: { click: ev => openDetail(d.kind, String(d.id), false, ev.currentTarget) } }, d.kind === 'cluster' ? 'Open the story' : 'Open the alert'))
            : safeUrl(s.link) ? h('div', {}, extLink(s.link, 'Open it in Chat', 'btn btn--tonal btn--sm')) : null);
      })));
    }
    add(wrap, sec);
    return wrap;
  }

  // ---------- Caught early ----------

  /** The Caught early view: the Head start tab as the bot wrote it (its numbers and its stories). Pure but for the DOM. */
  function earlyView() {
    const e = obj(S.snap.early);
    const wrap = h('div');
    add(wrap, lead('the Head start tab as the bot wrote it: how often this app\'s own stories came before Burson\'s alerts, and by how much.'));
    if (e.ok !== true) {
      add(wrap, emptyState('The Head start tab can\'t be shown', txt(e.why) || 'The bot\'s answer does not say why.', 'Open the bot\'s sheet to see the tab; it is rebuilt every 10 minutes.', refreshButton()));
      return wrap;

  // ---------- Held back ----------

  /** The Held back view: what was not posted and why, today or over the last 7 days. Pure but for the DOM. */
  function heldView() {

    const wrap = h('div');

      add(wrap, emptyState('Nothing to show', 'The bot\'s answer has no held-back figures.', 'Press Refresh to ask again.', refreshButton()));

    if (ed && typeof ed === 'object') {

      if (numOr(part.fastTriageToday) !== null) add(edCard, h('p', { class: 'small muted' }, `Looked at by the fast triage today: ${fmt(part.fastTriageToday)}.`));
    } else {
      add(edCard, h('p', { class: 'muted' }, txt(obj(held.earlyDetection).why) || 'The Early Detection tab could not be read.'));
    }
    const w = part.watch;

    if (w && typeof w === 'object') {

      if (arr(w.byCode).length) add(wCard, h('ul', { class: 'plain-list' }, arr(w.byCode).map(o => h('li', {}, `${fmt(obj(o).n)} · ${txt(obj(o).words) || txt(obj(o).code)}`))));
    } else {

    } else {
      add(dCard, h('p', { class: 'muted' }, txt(d.why) || 'Not kept for this window.'));
    }
    add(wrap, h('div', { class: 'grid-3' }, edCard, wCard, dCard));

    const inDays = r => !days.length || days.indexOf(txt(r.day)) >= 0;

    else {
      add(wrap, h('ul', { class: 'stuck-list' }, edRows.map(r => h('li', { class: 'stuck-item' }, h('div', { class: 'wrap-any' },
        h('div', { class: 'item-head' }, h('span', { class: 'pill st-plain' }, txt(r.outcome) || 'Not named'), r.at ? timeEl(r.at) : h('span', { class: 'small muted' }, txt(r.when))),
        h('div', { class: 'then-title', style: { 'margin-top': '6px' } }, r.link ? extLink(r.link, txt(r.story) || 'The story') : (txt(r.story) || 'Not named')),
        txt(r.why) ? h('p', { class: 'item-why' }, txt(r.why)) : null,
        h('p', { class: 'small muted' }, [r.accounts !== null && r.accounts !== undefined ? pl(r.accounts, 'account', 'accounts') : '', txt(r.platforms), txt(r.tag)].filter(Boolean).join(' · ')))))));
    }
    const wRows = arr(obj(held.watch).rows).map(obj).filter(inDays);
    add(wrap, h('h3', { class: 'section-title', style: { 'margin-top': '24px' } }, `Watch flags not posted (${wRows.length})`));

        h('div', { class: 'then-title', style: { 'margin-top': '6px' } }, txt(r.issue) || 'No issue named'),
        txt(r.why) ? h('p', { class: 'item-why' }, txt(r.why)) : null,
        h('p', { class: 'small muted' }, [txt(r.network), txt(r.author)].filter(Boolean).join(' · '), r.post ? ' · ' : '', r.post ? extLink(r.post, 'Open the post') : null))))));
